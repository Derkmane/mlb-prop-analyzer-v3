name: one-time-research-product-verify

on:
  push:
    branches:
      - codex/research-ranked-product
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Check scripts
        run: npm run check:scripts
      - name: Build
        run: npm run build
      - name: Check architecture
        run: npm run architecture
      - name: Test selected-side domain
        run: npm run test:selected-side
      - name: Test protective architecture rejection
        run: npm run test:architecture-protective
      - name: Run complete test suite
        run: node --test "dist/test/**/*.test.js" "test/**/*.test.mjs"
