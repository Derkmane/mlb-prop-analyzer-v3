name: M10 HHR Step B equivalence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-hhr-step-b-equivalence
  cancel-in-progress: false

jobs:
  equivalence:
    name: Regrade HHR scratch copies and prove Step B equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SOURCE_HHR_ROOT: artifacts/board-archives/batter-hhr
      HHR_GRADE_VERSION: m10-hhr-final-grade-v1
      EXPECTED_SOURCE_SET_SHA256: 8aabb3dc7403093eb6152378aa7784a909e0c3b4826f8d7334dd7d70113375de
      EXPECTED_RETAINED_ROWS: '422'
      EXPECTED_ARCHIVES_INCLUDED: '6'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Restore immutable HHR grading ledger read-only
        id: restore-hhr-ledger
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-step-b-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-
          fail-on-cache-miss: true

      - name: Copy pinned captures to scratch and verify byte hashes
        run: |
          set -euo pipefail
          SCRATCH_HHR_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-scratch"
          REFERENCE_GRADE_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-reference-grades"
          REPORT_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-report"
          export SCRATCH_HHR_ROOT REFERENCE_GRADE_ROOT REPORT_ROOT
          rm -rf "${SCRATCH_HHR_ROOT}" "${REFERENCE_GRADE_ROOT}" "${REPORT_ROOT}"
          mkdir -p "${SCRATCH_HHR_ROOT}/captures" "${REFERENCE_GRADE_ROOT}" "${REPORT_ROOT}"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const sourceRoot = process.env.SOURCE_HHR_ROOT;
          const scratchRoot = process.env.SCRATCH_HHR_ROOT;
          const referenceRoot = process.env.REFERENCE_GRADE_ROOT;
          const reportRoot = process.env.REPORT_ROOT;
          const gradeVersion = process.env.HHR_GRADE_VERSION;
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const requiredCaptureKeys = [
            '20260809T215425735Z--bf82c90d786a675f6f915eae13991c9c2ac5796a02cea83cd356170b775e8708',
            '20260810T220403246Z--6cc27b3aadbaae6062744a94aa4244d1b099df7ea0baa303c8e434da5e32d4a2',
            '20260811T155654406Z--2710065f9cb8576117db2f3c05b19d48c8b4a86166b0ca456ab35d75736a7028',
            '20260811T162447459Z--ddda7db0a4e092c737504e895ccea3a5c9d4b6f71ef3ed73edc7123623faab21',
            '20260811T220644516Z--c51b24f0238599dab4dddd45cdca52edf1fa6aabfe1a9f538e18bf729f7fe886',
          ];

          const sourceCaptures = path.join(sourceRoot, 'captures');
          if (!fs.existsSync(sourceCaptures)) {
            throw new Error(`Restored HHR ledger has no captures directory: ${sourceCaptures}`);
          }

          const hashLines = ['captureKey\tsourceByteSha256\tscratchByteSha256'];
          const referenceLines = ['captureKey\treferenceGradeSha256'];
          const gameIds = new Set();
          let referenceGradeCount = 0;

          for (const captureKey of requiredCaptureKeys) {
            const name = `${captureKey}.json`;
            const sourcePath = path.join(sourceCaptures, name);
            if (!fs.existsSync(sourcePath)) {
              throw new Error(`Required Step B capture missing from restored HHR ledger: ${captureKey}`);
            }

            const scratchPath = path.join(scratchRoot, 'captures', name);
            const sourceBytes = fs.readFileSync(sourcePath);
            const sourceHash = sha256(sourceBytes);
            fs.writeFileSync(scratchPath, sourceBytes, { flag: 'wx' });
            const scratchHash = sha256(fs.readFileSync(scratchPath));
            if (sourceHash !== scratchHash) {
              throw new Error(`Scratch capture byte hash mismatch for ${captureKey}: ${sourceHash} != ${scratchHash}`);
            }

            const archive = JSON.parse(sourceBytes.toString('utf8'));
            if (archive.captureKey !== captureKey) {
              throw new Error(`Capture key drift for ${captureKey}: archive says ${archive.captureKey}`);
            }
            if (!Array.isArray(archive.rows)) throw new Error(`Capture ${captureKey} rows must be an array.`);
            for (const row of archive.rows) {
              if (!Number.isSafeInteger(row.providerGameId) || row.providerGameId <= 0) {
                throw new Error(`Capture ${captureKey} contains an invalid providerGameId.`);
              }
              gameIds.add(row.providerGameId);
            }

            hashLines.push(`${captureKey}\t${sourceHash}\t${scratchHash}`);
            console.log(`CAPTURE HASH\t${captureKey}\t${sourceHash}\t${scratchHash}`);

            const realGradePath = path.join(sourceRoot, captureKey, 'grades', `${gradeVersion}.json`);
            if (fs.existsSync(realGradePath)) {
              const gradeBytes = fs.readFileSync(realGradePath);
              const gradeHash = sha256(gradeBytes);
              fs.writeFileSync(path.join(referenceRoot, `${captureKey}.json`), gradeBytes, { flag: 'wx' });
              referenceLines.push(`${captureKey}\t${gradeHash}`);
              referenceGradeCount += 1;
              console.log(`REFERENCE GRADE\t${captureKey}\t${gradeHash}`);
            } else {
              console.log(`REFERENCE GRADE MISSING\t${captureKey}`);
            }
          }

          fs.writeFileSync(path.join(reportRoot, 'capture-hashes.tsv'), `${hashLines.join('\n')}\n`);
          fs.writeFileSync(path.join(reportRoot, 'reference-grade-hashes.tsv'), `${referenceLines.join('\n')}\n`);
          fs.writeFileSync(path.join(reportRoot, 'capture-keys.txt'), `${requiredCaptureKeys.join('\n')}\n`);
          fs.writeFileSync(path.join(reportRoot, 'capture-count.txt'), `${requiredCaptureKeys.length}\n`);
          fs.writeFileSync(path.join(reportRoot, 'reference-grade-count.txt'), `${referenceGradeCount}\n`);
          fs.writeFileSync(path.join(reportRoot, 'unique-game-count.txt'), `${gameIds.size}\n`);
          console.log(`PINNED CAPTURE WORKLOAD\t${requiredCaptureKeys.join(',')}`);
          console.log(`CAPTURES COPIED\t${requiredCaptureKeys.length}`);
          console.log(`REFERENCE GRADES FOUND\t${referenceGradeCount}`);
          console.log(`UNIQUE GAME COUNT\t${gameIds.size}`);
          NODE

      - name: Run merged HHR grader against scratch ledger
        id: run-grader
        run: |
          set -uo pipefail
          SCRATCH_HHR_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-scratch"
          REPORT_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-report"
          export SCRATCH_HHR_ROOT REPORT_ROOT
          mkdir -p "${REPORT_ROOT}"
          LOG_PATH="${REPORT_ROOT}/grader.log"
          START_MS="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "HEAD SHA\t${GITHUB_SHA}" | tee "${REPORT_ROOT}/run-identity.tsv"
          echo "RUN URL\thttps://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | tee -a "${REPORT_ROOT}/run-identity.tsv"
          echo "START MS\t${START_MS}" | tee -a "${REPORT_ROOT}/run-identity.tsv"
          set +e
          M10_HHR_ARCHIVE_ROOT="${SCRATCH_HHR_ROOT}" \
          M10_GRADE_ATTEMPT_ID="step-b-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
          node scripts/grade-m10-hhr-pending-archives.mjs 2>&1 | tee "${LOG_PATH}"
          GRADER_STATUS=${PIPESTATUS[0]}
          set -e
          END_MS="$(node -e 'process.stdout.write(String(Date.now()))')"
          ELAPSED_MS=$((END_MS - START_MS))
          echo "END MS\t${END_MS}" | tee -a "${REPORT_ROOT}/run-identity.tsv"
          echo "WALL CLOCK MS\t${ELAPSED_MS}" | tee -a "${REPORT_ROOT}/run-identity.tsv"
          echo "GRADER EXIT\t${GRADER_STATUS}" | tee -a "${REPORT_ROOT}/run-identity.tsv"
          echo "grader_status=${GRADER_STATUS}" >> "$GITHUB_OUTPUT"
          echo "elapsed_ms=${ELAPSED_MS}" >> "$GITHUB_OUTPUT"

      - name: Report Step B evidence and validate equivalence
        if: always()
        env:
          GRADER_STATUS: ${{ steps.run-grader.outputs.grader_status }}
          ELAPSED_MS: ${{ steps.run-grader.outputs.elapsed_ms }}
        run: |
          set -euo pipefail
          SCRATCH_HHR_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-scratch"
          REFERENCE_GRADE_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-reference-grades"
          REPORT_ROOT="${RUNNER_TEMP}/m10-hhr-step-b-report"
          export SCRATCH_HHR_ROOT REFERENCE_GRADE_ROOT REPORT_ROOT
          mkdir -p "${REPORT_ROOT}"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const scratchRoot = process.env.SCRATCH_HHR_ROOT;
          const referenceRoot = process.env.REFERENCE_GRADE_ROOT;
          const reportRoot = process.env.REPORT_ROOT;
          const gradeVersion = process.env.HHR_GRADE_VERSION;
          const expectedSha = process.env.EXPECTED_SOURCE_SET_SHA256;
          const expectedRetainedRows = Number(process.env.EXPECTED_RETAINED_ROWS);
          const expectedArchivesIncluded = Number(process.env.EXPECTED_ARCHIVES_INCLUDED);
          const graderStatus = Number(process.env.GRADER_STATUS);
          const elapsedMs = Number(process.env.ELAPSED_MS);
          const graderLogPath = path.join(reportRoot, 'grader.log');
          const appendSummary = (text) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`);
          const validationErrors = [];

          const log = fs.existsSync(graderLogPath) ? fs.readFileSync(graderLogPath, 'utf8') : '';
          const metric = (label) => {
            const match = new RegExp(`^${label}\\t([^\\r\\n]+)$`, 'mu').exec(log);
            return match ? match[1] : null;
          };

          const requestCounts = {
            total: metric('BDL REQUESTS TOTAL'),
            gameStatus: metric('BDL GAME STATUS REQUESTS'),
            stats: metric('BDL STATS REQUESTS'),
            lineups: metric('BDL LINEUP REQUESTS'),
          };
          const blockedFromLog = metric('BLOCKED NOW');
          const uniqueGameCount = fs.existsSync(path.join(reportRoot, 'unique-game-count.txt'))
            ? Number(fs.readFileSync(path.join(reportRoot, 'unique-game-count.txt'), 'utf8').trim())
            : null;

          appendSummary('## HHR Step B equivalence');
          appendSummary(`- Head SHA: \`${process.env.GITHUB_SHA}\``);
          appendSummary(`- Run: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`);

          const captureHashPath = path.join(reportRoot, 'capture-hashes.tsv');
          console.log('CAPTURE HASH VERIFICATION\tBEGIN');
          if (fs.existsSync(captureHashPath)) {
            process.stdout.write(fs.readFileSync(captureHashPath, 'utf8'));
          } else {
            console.log('CAPTURE HASH VERIFICATION\tUNAVAILABLE');
            validationErrors.push('Capture hash evidence is unavailable.');
          }
          console.log('CAPTURE HASH VERIFICATION\tEND');

          console.log(`UNIQUE GAME COUNT\t${uniqueGameCount}`);
          console.log(`BDL GAME STATUS REQUESTS\t${requestCounts.gameStatus}`);
          console.log(`BDL STATS REQUESTS\t${requestCounts.stats}`);
          console.log(`BDL LINEUP REQUESTS\t${requestCounts.lineups}`);
          console.log(`BDL REQUESTS TOTAL\t${requestCounts.total}`);
          console.log(`WALL CLOCK MS\t${elapsedMs}`);
          console.log(`BLOCKED COUNT\t${blockedFromLog}`);
          appendSummary(`- Unique games: ${uniqueGameCount}`);
          appendSummary(`- BDL requests: total=${requestCounts.total}, game=${requestCounts.gameStatus}, stats=${requestCounts.stats}, lineups=${requestCounts.lineups}`);
          appendSummary(`- Wall clock: ${elapsedMs} ms`);
          appendSummary(`- Blocked: ${blockedFromLog}`);

          const expectedKeysPath = path.join(reportRoot, 'capture-keys.txt');
          const expectedKeys = fs.existsSync(expectedKeysPath)
            ? fs.readFileSync(expectedKeysPath, 'utf8').split(/\r?\n/u).filter(Boolean)
            : [];
          if (expectedKeys.length !== 5) {
            validationErrors.push(`Pinned capture-key evidence must contain exactly five keys; found ${expectedKeys.length}.`);
          }

          const referenceNames = fs.existsSync(referenceRoot)
            ? fs.readdirSync(referenceRoot).filter((name) => name.endsWith('.json')).sort()
            : [];
          const referenceKeys = referenceNames.map((name) => name.slice(0, -5));
          const scratchGradeKeys = [];
          if (fs.existsSync(scratchRoot)) {
            for (const entry of fs.readdirSync(scratchRoot, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const gradePath = path.join(scratchRoot, entry.name, 'grades', `${gradeVersion}.json`);
              if (fs.existsSync(gradePath)) scratchGradeKeys.push(entry.name);
            }
          }
          scratchGradeKeys.sort();

          if (JSON.stringify(referenceKeys) !== JSON.stringify(expectedKeys)) {
            validationErrors.push(`Reference graded capture set differs from pinned workload: expected=${expectedKeys.join(',')} reference=${referenceKeys.join(',')}`);
          }
          if (JSON.stringify(scratchGradeKeys) !== JSON.stringify(expectedKeys)) {
            validationErrors.push(`Scratch graded capture set differs from pinned workload: expected=${expectedKeys.join(',')} scratch=${scratchGradeKeys.join(',')}`);
          }

          console.log('GRADE COMPARISON CONTRACT\trows, summary, and stable source lineage only; gradedAt and archive path are intentionally excluded because a scratch rerun must record its real rerun time and scratch location');
          appendSummary('- Grade comparison contract: rows + summary + stable source lineage; `gradedAt` and archive path intentionally excluded.');

          const comparisonLines = [
            'captureKey\trows\trowsIdentical\tsummaryIdentical\tlineageIdentical\toutcomesIdentical',
          ];
          let allIdentical = expectedKeys.length === 5;

          for (const captureKey of expectedKeys) {
            const referencePath = path.join(referenceRoot, `${captureKey}.json`);
            const scratchPath = path.join(scratchRoot, captureKey, 'grades', `${gradeVersion}.json`);
            let rows = 'unavailable';
            let rowsIdentical = false;
            let summaryIdentical = false;
            let lineageIdentical = false;
            let outcomesIdentical = false;

            if (fs.existsSync(referencePath) && fs.existsSync(scratchPath)) {
              const reference = JSON.parse(fs.readFileSync(referencePath, 'utf8'));
              const scratch = JSON.parse(fs.readFileSync(scratchPath, 'utf8'));
              rows = Array.isArray(scratch.rows) ? scratch.rows.length : 'invalid';
              rowsIdentical = JSON.stringify(reference.rows) === JSON.stringify(scratch.rows);
              summaryIdentical = JSON.stringify(reference.summary) === JSON.stringify(scratch.summary);
              lineageIdentical =
                reference.source?.captureKey === scratch.source?.captureKey &&
                reference.source?.archiveSha256 === scratch.source?.archiveSha256 &&
                reference.source?.archiveFileSha256 === scratch.source?.archiveFileSha256 &&
                reference.source?.archiveModified === scratch.source?.archiveModified;
              outcomesIdentical = rowsIdentical && summaryIdentical && lineageIdentical;
            }

            allIdentical = allIdentical && outcomesIdentical;
            comparisonLines.push([
              captureKey,
              rows,
              rowsIdentical,
              summaryIdentical,
              lineageIdentical,
              outcomesIdentical,
            ].join('\t'));
            console.log(`CAPTURE COMPARISON\t${captureKey}\trows=${rows}\trowsIdentical=${rowsIdentical}\tsummaryIdentical=${summaryIdentical}\tlineageIdentical=${lineageIdentical}\toutcomesIdentical=${outcomesIdentical}`);
            if (!outcomesIdentical) {
              validationErrors.push(`Scratch grade outcomes differ from cache-restored real grade report for ${captureKey}.`);
            }
          }

          fs.writeFileSync(path.join(reportRoot, 'per-capture-comparison.tsv'), `${comparisonLines.join('\n')}\n`);
          console.log(`OUTCOMES IDENTICAL\t${allIdentical}`);
          appendSummary(`- Compared captures: ${expectedKeys.length}`);
          appendSummary(`- Outcomes identical: ${allIdentical}`);

          const metricLines = [
            'metric\tvalue',
            `headSha\t${process.env.GITHUB_SHA}`,
            `runUrl\thttps://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `wallClockMs\t${elapsedMs}`,
            `uniqueGameCount\t${uniqueGameCount}`,
            `bdlRequestsTotal\t${requestCounts.total}`,
            `bdlGameStatusRequests\t${requestCounts.gameStatus}`,
            `bdlStatsRequests\t${requestCounts.stats}`,
            `bdlLineupRequests\t${requestCounts.lineups}`,
            `graderExit\t${graderStatus}`,
            `blockedFromLog\t${blockedFromLog}`,
          ];

          let actualSha = null;
          let retainedRows = null;
          let picksGraded = null;
          let archivesIncluded = null;
          const cumulativeDir = path.join(scratchRoot, 'cumulative');
          const cumulativeNames = fs.existsSync(cumulativeDir)
            ? fs.readdirSync(cumulativeDir)
                .filter((name) => /^m10-hhr-cumulative-selected-side-v1--[a-f0-9]{64}\.json$/u.test(name))
                .sort()
            : [];

          if (cumulativeNames.length === 1) {
            const cumulativePath = path.join(cumulativeDir, cumulativeNames[0]);
            const cumulative = JSON.parse(fs.readFileSync(cumulativePath, 'utf8'));
            actualSha = cumulative.sourceSetSha256;
            retainedRows = cumulative.selectedSide?.retainedSelectedSideRows;
            picksGraded = cumulative.selectedSide?.summary?.picksGraded;
            archivesIncluded = cumulative.archivesIncluded;
          } else {
            validationErrors.push(`Expected exactly one scratch cumulative report; found ${cumulativeNames.length}.`);
          }

          metricLines.push(`sourceSetSha256\t${actualSha}`);
          metricLines.push(`retainedSelectedSideRows\t${retainedRows}`);
          metricLines.push(`selectedSidePicksGraded\t${picksGraded}`);
          metricLines.push(`archivesIncluded\t${archivesIncluded}`);
          fs.writeFileSync(path.join(reportRoot, 'metrics.tsv'), `${metricLines.join('\n')}\n`);

          console.log(`CUMULATIVE ARCHIVES INCLUDED\t${archivesIncluded}`);
          console.log(`CUMULATIVE SOURCE SET SHA256\t${actualSha}`);
          console.log(`RETAINED ROWS\t${retainedRows}`);
          appendSummary(`- Archives included: ${archivesIncluded}`);
          appendSummary(`- sourceSetSha256: \`${actualSha}\``);
          appendSummary(`- Retained rows: ${retainedRows}`);

          if (actualSha !== expectedSha) {
            validationErrors.push(`Step B cumulative SHA mismatch: expected ${expectedSha}, got ${actualSha}.`);
          }
          if (archivesIncluded !== expectedArchivesIncluded) {
            validationErrors.push(`Step B archive-count mismatch: expected ${expectedArchivesIncluded}, got ${archivesIncluded}.`);
          }
          if (retainedRows !== expectedRetainedRows || picksGraded !== expectedRetainedRows) {
            validationErrors.push(`Step B retained-row mismatch: expected ${expectedRetainedRows}, got retained=${retainedRows}, picksGraded=${picksGraded}.`);
          }
          if (blockedFromLog !== '0') {
            validationErrors.push(`Step B blocked-count mismatch: expected 0, got ${blockedFromLog}.`);
          }
          if (!Number.isSafeInteger(graderStatus) || graderStatus !== 0) {
            validationErrors.push(`Step B scratch grader exited ${process.env.GRADER_STATUS}.`);
          }
          if (Object.values(requestCounts).some((value) => value === null || !/^\d+$/u.test(value))) {
            validationErrors.push('Step B grader did not emit complete BDL request counters.');
          }
          if (!Number.isSafeInteger(elapsedMs) || elapsedMs < 0) {
            validationErrors.push(`Step B grader did not emit a valid wall clock duration: ${process.env.ELAPSED_MS}.`);
          }

          if (validationErrors.length > 0) {
            console.log('STEP B EQUIVALENCE\tFAIL');
            for (const error of validationErrors) console.log(`VALIDATION ERROR\t${error}`);
            appendSummary('- **Step B equivalence: FAIL**');
            throw new Error(validationErrors.join(' | '));
          }

          console.log('STEP B EQUIVALENCE\tPASS');
          appendSummary('- **Step B equivalence: PASS**');
          NODE

      - name: Upload Step B scratch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-hhr-step-b-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/m10-hhr-step-b-scratch/**
            ${{ runner.temp }}/m10-hhr-step-b-report/**
