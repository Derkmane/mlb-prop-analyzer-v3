name: m8-base-bridge-checklist-sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/m8-base-bridge-checklist'
    runs-on: ubuntu-latest
    steps:
      - name: Check out checklist branch
        uses: actions/checkout@v4
        with:
          ref: agent/m8-base-bridge-checklist
          fetch-depth: 0

      - name: Apply and verify checklist amendment
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/m8_base_bridge_checklist_sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m8-base-bridge-checklist-sync.yml
          git rm .github/scripts/m8_base_bridge_checklist_sync.py
          git add PROJECT_CHECKLIST.md
          git commit -m 'Define M8 base bridge and M8.5 checklist sequence'
          changed="$(git diff --name-only origin/agent/m8-c2-production-seal-gate...HEAD | sort)"
          test "$changed" = 'PROJECT_CHECKLIST.md'
          git push origin HEAD:agent/m8-base-bridge-checklist
