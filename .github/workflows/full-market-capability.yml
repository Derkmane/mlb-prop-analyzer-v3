name: Full-market Underdog capability capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Capture live Underdog market capability
        run: node scripts/capture-full-market-capability.mjs

      - name: Upload sanitized capability fixture
        uses: actions/upload-artifact@v4
        with:
          name: full-market-underdog-capability
          path: fixtures/sanitized/provider-capabilities/2026-08-18/full-market-underdog-capability.json
          if-no-files-found: error
