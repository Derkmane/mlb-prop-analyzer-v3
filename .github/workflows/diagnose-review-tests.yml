name: diagnose-review-tests

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-review-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and build
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Capture complete test suite
        run: |
          set +e
          node --test "dist/test/**/*.test.js" > review-test.log 2>&1
          echo "$?" > review-test-status.txt
          exit 0
      - name: Upload complete test output
        uses: actions/upload-artifact@v4
        with:
          name: review-test-diagnostic
          path: |
            review-test.log
            review-test-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report test result
        run: exit "$(cat review-test-status.txt)"
