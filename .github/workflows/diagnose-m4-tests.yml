name: diagnose-m4-tests

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-m4-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and build
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Capture focused M4 tests
        run: |
          set +e
          node --test dist/test/core-probability.test.js dist/test/core-settlement-ranking.test.js > m4-test.log 2>&1
          echo "$?" > m4-test-status.txt
          exit 0
      - name: Upload focused test diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: m4-test-diagnostic
          path: |
            m4-test.log
            m4-test-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report focused test result
        run: exit "$(cat m4-test-status.txt)"
