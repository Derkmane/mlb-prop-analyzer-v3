name: m7-test-tally

on:
  pull_request:
    branches:
      - main

jobs:
  capture-test-tally:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite and capture output
        run: |
          set -o pipefail
          npm test 2>&1 | tee m7-test-output.txt
      - name: Upload literal test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-literal-test-output
          path: m7-test-output.txt
          if-no-files-found: error
