name: m8-5-bullpen-script-check-sync
on:
  push:
    branches: [agent/m8-5-team-bullpen-outcome]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m8-5-team-bullpen-outcome
      - name: Add bullpen scripts to the existing check chain
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const additions = [
            'node --check scripts/m8-5-team-bullpen-outcome-utils.mjs',
            'node --check scripts/evaluate-m8-5-team-bullpen-outcome.mjs',
          ];
          for (const addition of additions) {
            if (!packageJson.scripts['check:scripts'].includes(addition)) {
              packageJson.scripts['check:scripts'] += ` && ${addition}`;
            }
          }
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git commit -m "Include bullpen evaluator in the existing script check"
          git push
