name: m9-merge-canonical-parent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  merge-parent:
    if: github.head_ref == 'agent/m9-live-archive-grading-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out M9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/m9-live-archive-grading-clean
          fetch-depth: 0

      - name: Record canonical branch as merge parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/canonical-soft-line-definition-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m9-merge-canonical-parent.yml
          git commit -m 'Remove temporary canonical merge workflow'
          git merge --no-ff origin/agent/canonical-soft-line-definition-main \
            -m 'Merge canonical source authority into M9 branch'
          printf '%s  %s\n' \
            '729e342fef5e3b1ac07de89aa03b0b539dfa2a1df100b759f1265b30a6636d7e' \
            'PROJECT_RULES.md' | sha256sum --check
          printf '%s  %s\n' \
            'cd18a6283cb39f8793813aa46b8e43775d2854ce40c7b2719616f8fe603c6457' \
            'CANONICAL_MATH_SPEC.md' | sha256sum --check
          git push origin HEAD:agent/m9-live-archive-grading-clean
