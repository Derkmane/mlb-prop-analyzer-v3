name: diagnose-main-test-count

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-main-test-count.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Make locked URLs runnable without changing main
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package-lock.json')
          original = path.read_text(encoding='utf-8')
          old = 'http://package-firewall.replit.local/npm/'
          new = 'https://registry.npmjs.org/'
          count = original.count(old)
          if count != 47:
              raise RuntimeError(f'expected 47 private URLs, found {count}')
          updated = original.replace(old, new)
          json.loads(original)
          json.loads(updated)
          if updated.replace(new, old) != original:
              raise RuntimeError('non-URL lockfile content changed')
          path.write_text(updated, encoding='utf-8')
          print(f'Runtime-only URL replacements: {count}')
          PY
      - name: Install and build main
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Capture main test tally
        run: |
          set +e
          node --test "dist/test/**/*.test.js" > main-test.log 2>&1
          echo "$?" > main-test-status.txt
          exit 0
      - name: Upload main test output
        uses: actions/upload-artifact@v4
        with:
          name: main-test-tally
          path: |
            main-test.log
            main-test-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report main test result
        run: exit "$(cat main-test-status.txt)"
