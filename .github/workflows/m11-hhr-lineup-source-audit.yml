name: M11 HHR lineup source audit

on:
  push:
    branches:
      - agent/hhr-lineup-source-audit

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Audit approved BDL lineup signal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      M10_ARCHIVE_ROOT: artifacts/board-archives/batter-hits
      M10_HHR_ARCHIVE_ROOT: artifacts/board-archives/batter-hhr

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore immutable HHR archive and grade ledger
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m11-hhr-lineup-audit-hhr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-

      - name: Restore immutable Batter Hits archive ledger
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m11-hhr-lineup-audit-hits-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m9-board-archive-ledger-

      - name: Run approved-source lineup audit
        run: node scripts/m11-hhr-lineup-source-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-hhr-lineup-source-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/diagnostics/m11-hhr-lineup-source-audit/report.json
