name: canonical-soft-line-sync

on:
  push:
    branches:
      - agent/canonical-soft-line-definition

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-soft-line-definition
          fetch-depth: 0

      - name: Apply and verify complete canonical replacements
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          rules_path = Path('PROJECT_RULES.md')
          math_path = Path('CANONICAL_MATH_SPEC.md')
          rules = rules_path.read_text()
          math = math_path.read_text()

          assert sha256(rules.encode()).hexdigest() == '1396fc2aa88104a35eb52d1945659d3317232e98614d3a13f5b18bf130e6463d'
          assert sha256(math.encode()).hexdigest() == '2829eb29de950cc6a206e4edf5c624a207b1fc9a43d4eefab96e5d94dcea5b7d'

          rules = rules.replace('**Version:** 2.4\\\n', '**Version:** 2.5\\\n', 1)

          rules_anchor = '''Every technical subtask must directly improve, validate, protect, or
display side-aware probability, eligibility, workload, distribution
construction, settlement, calibration, reproducibility, category
ranking, saved predictions, or grading.

------------------------------------------------------------------------
'''
          rules_replacement = '''Every technical subtask must directly improve, validate, protect, or
display side-aware probability, eligibility, workload, distribution
construction, settlement, calibration, reproducibility, category
ranking, saved predictions, or grading.

### Side-aware soft-line discovery --- LOCKED

A **soft line** is an exact posted Underdog offer whose selected side and
line produce favorable side-specific probability under an approved,
versioned base baseball distribution and discovery rule.

Rules:

-   a line may be soft to Higher because it is posted too low relative
    to the modeled distribution
-   a line may be soft to Lower because it is posted too high relative
    to the modeled distribution
-   every exact posted Higher or Lower offer is evaluated on its own
    selected side and line; neither side receives preference
-   expected player output, fair-line distance, price, or multiplier may
    be preserved as evidence or metadata but may not replace exact
    side-and-line settlement probability
-   the base soft-line probability and discovery decision are
    preliminary evidence, not the final ranking probability
-   every later approved context factor must act through eligibility,
    workload, shared scenarios, or the statistic distribution; the app
    must then recompute and resettle the exact posted side and line
-   the final context-adjusted `P(Win | grades)` is the only probability
    used for category ranking
-   base softness margin, context probability delta, multiplier, and
    discovery labels may not independently alter final ranking
-   a hard discovery cutoff may exclude offers from complete context
    evaluation only after chronological current-season validation shows
    that the cutoff preserves the strongest final-probability
    candidates at the approved recall standard
-   until that validation exists, discovery must be an audit label, a
    broad high-recall screen, or both; it may not silently discard an
    offer that could become one of the strongest final picks

The base distribution, discovery method, final context-adjusted
distribution, and all corresponding versions must remain distinct and
auditable whenever this two-stage process is used.

------------------------------------------------------------------------
'''
          assert rules_anchor in rules
          rules = rules.replace(rules_anchor, rules_replacement, 1)

          projected_anchor = '''-   projected starters and batting order must come from an approved,
    versioned, current-season evidence path; the projection method must
    be validated separately, but projection status is not a probability
    penalty
-   a player who is neither projected nor confirmed to start may not be
    treated as a starting hitter merely because an offer exists
'''
          projected_replacement = '''-   projected starters and batting order must come from an approved,
    versioned, current-season evidence path; the projection method must
    be validated separately, but projection status is not a probability
    penalty
-   projection accuracy, coverage, exact-slot accuracy, and
    projected-versus-confirmed replacement rates may be measured, saved,
    and displayed as diagnostic evidence, but those diagnostics may not
    reduce `P(Win)`, `P(Win | grades)`, eligibility, category access,
    ranking, or confidence or increase `P(Void)` solely because the
    active lineup is projected
-   only an actual change in player identity, batting order, opposing
    starter, or another approved baseball input may change the modeled
    distribution when confirmed information replaces the projection
-   a player who is neither projected nor confirmed to start may not be
    treated as a starting hitter merely because an offer exists
'''
          assert projected_anchor in rules
          rules = rules.replace(projected_anchor, projected_replacement, 1)

          flow_anchor = '''raw provider response
→ immutable raw snapshot
→ runtime-validated provider schema
→ normalized contracts
→ shared GameScenarioSet
→ market feature statistic distribution and eligibility
→ core settlement and side-aware probabilities
→ generic candidate
→ category selection and ranking
→ immutable saved run
→ API, CLI, and UI view models
'''
          flow_replacement = '''raw provider response
→ immutable raw snapshot
→ runtime-validated provider schema
→ normalized contracts
→ shared GameScenarioSet
→ market feature statistic distribution and eligibility
→ when used, versioned side-aware base discovery evidence and validated
  context-adjusted final distribution
→ core settlement and final side-aware probabilities
→ generic candidate
→ category selection and ranking
→ immutable saved run
→ API, CLI, and UI view models
'''
          assert flow_anchor in rules
          rules = rules.replace(flow_anchor, flow_replacement, 1)

          examples_anchor = '''-   UI may not call BALLDONTLIE directly.
-   Infrastructure may not rank candidates.
-   Categories may not change `P(Win)`.
-   Features may not create arbitrary saved-run formats.
-   Historical rendering may not rerun the current production model.
'''
          examples_replacement = '''-   UI may not call BALLDONTLIE directly.
-   Infrastructure may not rank candidates.
-   Categories may not change `P(Win)`.
-   Soft-line discovery may not replace or bypass the validated final
    context model.
-   Base discovery probability, context probability delta, and
    multiplier may not replace final `P(Win | grades)` in ranking.
-   Features may not create arbitrary saved-run formats.
-   Historical rendering may not rerun the current production model.
'''
          assert examples_anchor in rules
          rules = rules.replace(examples_anchor, examples_replacement, 1)

          saved_anchor = '''-   scenario weights
-   opportunity distributions
-   final statistic distribution
-   `P(Win)`, `P(Loss)`, `P(Void)`, and `P(Win | grades)`
'''
          saved_replacement = '''-   scenario weights
-   opportunity distributions
-   base statistic distribution and base side-specific probabilities
    when soft-line discovery is used
-   soft-line discovery method and version when soft-line discovery is
    used
-   final context-adjusted statistic distribution
-   final context-model and factor-artifact versions
-   context probability delta when it is reported
-   `P(Win)`, `P(Loss)`, `P(Void)`, and `P(Win | grades)`
'''
          assert saved_anchor in rules
          rules = rules.replace(saved_anchor, saved_replacement, 1)

          changelog_anchor = '''## Changelog

### Version 2.4 --- 2026-07-31
'''
          changelog_replacement = '''## Changelog

### Version 2.5 --- 2026-08-01

-   Defined a soft line as an exact posted offer that may favor either
    Higher or Lower under an approved side-aware base distribution and
    discovery rule.
-   Separated preliminary base soft-line probability from final
    context-adjusted probability and locked final `P(Win | grades)` as
    the only category-ranking probability.
-   Required all context factors to act through eligibility, workload,
    shared scenarios, or the statistic distribution before exact
    settlement and prohibited direct probability-point boosters.
-   Required any hard discovery cutoff to prove high recall for the
    strongest final-probability candidates before it may exclude offers
    from full context evaluation.
-   Clarified that projected-lineup accuracy and replacement metrics are
    diagnostic only and may not penalize probability, eligibility,
    void, confidence, category access, or ranking.
-   Added audit and saved-record requirements for base distribution,
    discovery method, final context distribution, factor versions, and
    reported probability delta.

### Version 2.4 --- 2026-07-31
'''
          assert changelog_anchor in rules
          rules = rules.replace(changelog_anchor, changelog_replacement, 1)

          math = math.replace('**Version:** 1.5\n', '**Version:** 1.6\n', 1)

          display_anchor = '''Display separately:

- projected start probability
- chance the pick grades
- projected void probability
- `P(Win | grades)`

They may be numerically close but are not interchangeable concepts.
'''
          display_replacement = '''Display separately when available:

- approved projected-start or lineup-projection diagnostic evidence
- chance the pick grades
- projected void probability
- `P(Win | grades)`

An approved projection model may report projected-start probability,
coverage, exact-slot accuracy, or historical projected-versus-confirmed
accuracy as diagnostics. Those diagnostics may not alter `P(A)`,
`P(Win)`, `P(Loss)`, `P(Void)`, `P(Win | grades)`, eligibility, or
ranking solely because the active lineup status is projected. Until
confirmed information replaces it, the approved projected lineup is the
active baseball assumption. Only an actual change in player identity,
batting order, opposing starter, or another approved baseball input may
change the modeled distribution.

These displayed quantities may be numerically close but are not
interchangeable concepts.
'''
          assert display_anchor in math
          math = math.replace(display_anchor, display_replacement, 1)

          math_anchor = '''Do not assign a direct side-independent booster or penalty score.

---

## 12. Settlement and market model registry
'''
          math_replacement = '''Do not assign a direct side-independent booster or penalty score.

### 11.1 Base soft-line discovery and final context-adjusted probability

When the approved prediction path uses a base model for discovery before
a later validated context model, the two stages must remain
mathematically distinct.

Let:

```text
D_base = approved versioned base distribution of X
D_final = approved versioned context-adjusted final distribution of X
d = exact posted selected side
L = exact posted line
```

Settle each distribution through the same versioned eligibility and
settlement rules:

```text
p_base(d,L)
  = P_base(Win | grades; d,L)

p_final(d,L)
  = P_final(Win | grades; d,L)
```

For a Higher offer:

```text
p_base(Higher,L)
  = P_base(X > L | A)
    / [P_base(X > L | A) + P_base(X < L | A)]

p_final(Higher,L)
  = P_final(X > L | A)
    / [P_final(X > L | A) + P_final(X < L | A)]
```

For a Lower offer:

```text
p_base(Lower,L)
  = P_base(X < L | A)
    / [P_base(X < L | A) + P_base(X > L | A)]

p_final(Lower,L)
  = P_final(X < L | A)
    / [P_final(X < L | A) + P_final(X > L | A)]
```

A **soft-line candidate** is an exact posted offer whose `p_base(d,L)`
satisfies an approved, versioned discovery rule. A line may be soft to
Higher or soft to Lower. Neither direction receives preference.

The discovery rule may be expressed as a threshold or another
chronologically validated side-aware predicate. When a threshold
`tau_soft` is used:

```text
softnessMargin(d,L)
  = p_base(d,L) - tau_soft
```

The threshold is a versioned model-selection quantity. It is not fixed
at `0.50` by this specification and may not be invented during runtime.

The context probability delta is:

```text
contextProbabilityDelta(d,L)
  = p_final(d,L) - p_base(d,L)
```

This delta is diagnostic evidence only. It may explain how validated
context strengthened or weakened the exact posted side, but it may not
replace `p_final(d,L)` in ranking.

Required invariants:

1. `D_base` and `D_final` are explicit versioned distributions.
2. Every context factor acts through eligibility, workload, shared
   scenarios, or the distribution of `X`; no factor directly adds or
   subtracts probability points.
3. Context-factor models may not use the selected side as a model input.
   Side awareness appears when the resulting distribution is settled
   against the exact posted side and line.
4. The exact same final distribution is used for baseline and alternate
   offers for the same player, game, and settlement statistic; only
   posted offer attributes and settlement differ.
5. Category ranking uses only final `P(Win | grades)`, then `P(Void)`.
   `p_base`, softness margin, context probability delta, price,
   multiplier, and discovery labels are not ranking quantities.
6. A hard discovery filter may prevent full context evaluation only
   after chronological current-season validation establishes an
   approved recall standard for the strongest `p_final` candidates.
   Without that evidence, every supported offer must receive the full
   model or pass only through a broad high-recall discovery screen.

---

## 12. Settlement and market model registry
'''
          assert math_anchor in math
          math = math.replace(math_anchor, math_replacement, 1)

          verification_anchor = '''34. Planned, disabled, or not-yet-production-validated markets fail closed and cannot reach ranking.
35. Production engine modules cannot import audit, deprecated, prior-season, or unapproved fallback models.
'''
          verification_replacement = '''34. Planned, disabled, or not-yet-production-validated markets fail closed and cannot reach ranking.
35. Production engine modules cannot import audit, deprecated, prior-season, or unapproved fallback models.
36. Base soft-line probability is produced by exact settlement of the
    versioned base distribution for the exact posted side and line.
37. Final context probability is produced by recomputing and exactly
    settling the versioned final distribution; no direct probability
    increment or decrement is allowed.
38. Context-factor modules cannot read selected side, and the same
    distributional shift helps one side while hurting the opposite side
    under exact settlement.
39. Final category ordering uses final `P(Win | grades)`, then `P(Void)`;
    base probability, softness margin, context delta, multiplier, and
    discovery labels cannot alter the order.
40. Any hard discovery cutoff demonstrates the approved current-season
    recall standard against full-model final probabilities before it may
    exclude offers from complete context evaluation.
41. Projected-lineup diagnostics cannot change model probabilities,
    eligibility, void, confidence, category access, or ranking solely
    because lineup status is projected.
'''
          assert verification_anchor in math
          math = math.replace(verification_anchor, verification_replacement, 1)

          definitions_anchor = '''### Shared and hitter components

- within-current-season recency weighting by outcome
'''
          definitions_replacement = '''### Shared and hitter components

- side-aware soft-line discovery rule, threshold or predicate, version,
  and current-season recall validation
- base-versus-final distribution contract and context probability-delta
  reporting
- within-current-season recency weighting by outcome
'''
          assert definitions_anchor in math
          math = math.replace(definitions_anchor, definitions_replacement, 1)

          quick_anchor = '''Ranking:
P(Win|grades) = P(Win) / [P(Win)+P(Loss)]

Side direction:
'''
          quick_replacement = '''Ranking:
P(Win|grades) = P(Win) / [P(Win)+P(Loss)]

Two-stage soft-line path:
p_base(d,L)  = exact selected-side settlement of D_base
p_final(d,L) = exact selected-side settlement of D_final
softnessMargin = p_base(d,L) - tau_soft
contextProbabilityDelta = p_final(d,L) - p_base(d,L)
rank by p_final(d,L), then P(Void)

Side direction:
'''
          assert quick_anchor in math
          math = math.replace(quick_anchor, quick_replacement, 1)

          math_changelog_anchor = '''## Changelog

### Version 1.5 — 2026-07-29
'''
          math_changelog_replacement = '''## Changelog

### Version 1.6 — 2026-08-01

- Defined side-aware soft-line discovery for exact posted Higher and
  Lower offers using a versioned base distribution and discovery rule.
- Separated base discovery probability from final context-adjusted
  probability and defined softness margin and context probability delta
  as auditable non-ranking quantities.
- Locked all context factors to eligibility, workload, shared scenarios,
  or statistic-distribution effects before exact settlement and
  prohibited direct probability-point boosters.
- Required context-factor models to remain side-independent in their
  inputs while preserving directional Higher/Lower effects through
  settlement.
- Required final category ranking to use final `P(Win | grades)`, then
  `P(Void)`, and prohibited base probability, softness margin, context
  delta, price, multiplier, or discovery labels from altering rank.
- Required a hard discovery filter to prove current-season recall for
  the strongest full-model final probabilities before excluding offers
  from complete context evaluation.
- Clarified that projected-lineup probability and accuracy measures are
  diagnostic only and cannot penalize probabilities, eligibility, void,
  confidence, category access, or ranking solely because status is
  projected.

### Version 1.5 — 2026-07-29
'''
          assert math_changelog_anchor in math
          math = math.replace(math_changelog_anchor, math_changelog_replacement, 1)

          assert sha256(rules.encode()).hexdigest() == '729e342fef5e3b1ac07de89aa03b0b539dfa2a1df100b759f1265b30a6636d7e'
          assert sha256(math.encode()).hexdigest() == 'cd18a6283cb39f8793813aa46b8e43775d2854ce40c7b2719616f8fe603c6457'

          rules_path.write_text(rules)
          math_path.write_text(math)
          print('PROJECT_RULES.md', sha256(rules_path.read_bytes()).hexdigest())
          print('CANONICAL_MATH_SPEC.md', sha256(math_path.read_bytes()).hexdigest())
          PY

      - name: Verify focused canonical diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CANONICAL_MATH_SPEC.md PROJECT_RULES.md "
          grep -F '**Version:** 2.5\' PROJECT_RULES.md
          grep -F '**Version:** 1.6' CANONICAL_MATH_SPEC.md
          grep -F '### Side-aware soft-line discovery --- LOCKED' PROJECT_RULES.md
          grep -F '### 11.1 Base soft-line discovery and final context-adjusted probability' CANONICAL_MATH_SPEC.md

      - name: Commit canonical replacements and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_RULES.md CANONICAL_MATH_SPEC.md
          git rm .github/workflows/canonical-soft-line-sync.yml
          git commit -m "Define side-aware soft-line canonical rules"
          git push origin HEAD:agent/canonical-soft-line-definition
