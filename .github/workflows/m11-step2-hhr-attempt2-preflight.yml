name: M11 HHR attempt 2 preflight correction

on:
  push:
    branches:
      - agent/m11-step2-hhr-attempt2
    paths:
      - .github/workflows/m11-step2-hhr-attempt2-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Correct starter-source contract for named chronology constants
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'test/m11-hhr-starter-source-contract.test.mjs';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(
            "  assert.match(source, /pitcherAllowedDataEndDate: '2026-07-05'/u);\n  assert.match(source, /hhrFitStartDate: FIT_DATES\\[0\\]/u);\n  assert.match(source, /overlap: false/u);",
            "  assert.match(source, /const FROZEN_HISTORY_END_DATE = '2026-07-05'/u);\n  assert.match(source, /pitcherAllowedDataEndDate: FROZEN_HISTORY_END_DATE/u);\n  assert.match(source, /const FIT_START_DATE = '2026-07-06'/u);\n  assert.match(source, /hhrFitStartDate: FIT_DATES\\[0\\]/u);\n  assert.match(source, /overlap: lookaheadOverlap/u);\n  assert.match(source, /if \\(lookaheadOverlap\\) throw new Error\\('HHR attempt 2 lookahead overlap detected before fitting\\.'\\)/u);",
          );
          if (!text.includes("pitcherAllowedDataEndDate: FROZEN_HISTORY_END_DATE")) {
            throw new Error('Starter-source contract correction anchor drifted.');
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Rerun complete pre-capture gate
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          node --check scripts/capture-m11-hhr-respecified-evidence.mjs
          node --check scripts/fit-m11-batter-hhr-respecified.mjs
          node --test test/m11-hhr-starter-source-contract.test.mjs test/m11-hhr-attempt2-source-contract.test.mjs test/m8-starter-bullpen-transition.test.mjs
          npm run build
          node --test test/m11-batter-hits-byte-identity.test.mjs
          npm run typecheck
          npm run check:scripts
          git diff --check
          echo 'ATTEMPT 2 PRE-CAPTURE GATE: PASS'
      - name: Commit focused correction and remove transport
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/m11-hhr-starter-source-contract.test.mjs
          git rm .github/workflows/m11-step2-hhr-attempt2-preflight.yml
          git commit -m "Align HHR starter contract with named chronology constants"
          git push origin HEAD:agent/m11-step2-hhr-attempt2
