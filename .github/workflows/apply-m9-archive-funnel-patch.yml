name: apply-m9-archive-funnel-patch

on:
  push:
    branches:
      - agent/m9-board-archiving
    paths:
      - .github/workflows/apply-m9-archive-funnel-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m9-board-archiving
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/.apply-m9-archive-funnel-patch.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate M9 archive funnel diagnostics"
          git push origin HEAD:agent/m9-board-archiving
