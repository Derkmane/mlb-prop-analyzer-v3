name: M11 step 2 source trace and fail-closed fixes

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification
    paths:
      - .github/workflows/m11-step2-source-trace-failclosed-fixes.yml

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Inspect existing BALLDONTLIE per-game stats schema
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const apiKey = process.env.BALLDONTLIE_API_KEY?.trim();
          if (!apiKey) throw new Error('Missing BALLDONTLIE_API_KEY.');
          const url = new URL('https://api.balldontlie.io/mlb/v1/stats');
          url.searchParams.append('game_ids[]', '5059313');
          url.searchParams.set('per_page', '100');
          const response = await fetch(url, { headers: { Authorization: apiKey } });
          const text = await response.text();
          if (!response.ok) throw new Error(`BALLDONTLIE stats returned HTTP ${response.status}: ${text.slice(0, 500)}`);
          const body = JSON.parse(text);
          if (!Array.isArray(body?.data)) throw new Error('BALLDONTLIE stats data must be an array.');
          const rows = body.data;
          const unionKeys = [...new Set(rows.flatMap((row) => Object.keys(row ?? {})))].sort();
          const relevantPattern = /(pitch|start|appear|order|inning|throw|win|loss|save|hold|era|whip|strikeout|earned|batter.*faced)/iu;
          const relevantPaths = new Set();
          function walk(value, prefix = '') {
            if (value === null || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value.slice(0, 3)) walk(item, `${prefix}[]`);
              return;
            }
            for (const [key, child] of Object.entries(value)) {
              const path = prefix ? `${prefix}.${key}` : key;
              if (relevantPattern.test(path)) relevantPaths.add(path);
              walk(child, path);
            }
          }
          for (const row of rows) walk(row);
          console.log('=== BALLDONTLIE COMPLETED-GAME STATS SCHEMA ===');
          console.log('REQUEST: GET /mlb/v1/stats?game_ids[]=5059313&per_page=100');
          console.log(`ROW COUNT: ${rows.length}`);
          console.log(`ROOT ROW KEYS: ${unionKeys.join(',')}`);
          console.log(`RELEVANT PATHS: ${[...relevantPaths].sort().join(',') || 'NONE'}`);
          const samples = rows.slice(0, 3).map((row) => ({
            game_id: row?.game_id ?? null,
            player_id: row?.player?.id ?? null,
            player_name: row?.player?.full_name ?? null,
            player_bats_throws: row?.player?.bats_throws ?? null,
            team_id: row?.team?.id ?? null,
            relevant: Object.fromEntries(Object.entries(row ?? {}).filter(([key]) => relevantPattern.test(key))),
          }));
          console.log(`SAMPLE ROWS: ${JSON.stringify(samples)}`);
          console.log('=== END BALLDONTLIE COMPLETED-GAME STATS SCHEMA ===');
          NODE

      - name: Audit and fix workflow pipe handling and diagnostic retention
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const workflowDirectory = '.github/workflows';
          const workflowFiles = fs.readdirSync(workflowDirectory)
            .filter((name) => /\.ya?ml$/u.test(name))
            .map((name) => path.join(workflowDirectory, name))
            .filter((file) => !file.endsWith('m11-step2-source-trace-failclosed-fixes.yml'))
            .sort();

          function shellRunBlocks(text) {
            const lines = text.split('\n');
            const blocks = [];
            for (let index = 0; index < lines.length; index += 1) {
              const match = /^(\s*)run:\s*\|\s*$/u.exec(lines[index]);
              if (!match) continue;
              const runIndent = match[1].length;
              let end = index + 1;
              while (end < lines.length) {
                const line = lines[end];
                if (line.trim() === '') { end += 1; continue; }
                const indent = /^\s*/u.exec(line)[0].length;
                if (indent <= runIndent) break;
                end += 1;
              }
              blocks.push({ lines, start: index, end, runIndent });
              index = end - 1;
            }
            return blocks;
          }

          function blockHasPipeline(lines, start, end) {
            return lines.slice(start + 1, end).some((line) => {
              const command = line.trim();
              if (!command || command.startsWith('#')) return false;
              return /\s\|\s/u.test(command) || /\|\s*(tee|grep|head|tail|sed|awk|xargs)\b/u.test(command);
            });
          }

          const occurrences = [];
          for (const file of workflowFiles) {
            const original = fs.readFileSync(file, 'utf8');
            const lines = original.split('\n');
            const blocks = shellRunBlocks(original).reverse();
            for (const block of blocks) {
              if (!blockHasPipeline(lines, block.start, block.end)) continue;
              const commandIndent = ' '.repeat(block.runIndent + 2);
              const commands = lines.slice(block.start + 1, block.end);
              const pipelineLines = commands
                .map((line, offset) => ({ line: line.trim(), number: block.start + 2 + offset }))
                .filter(({ line }) => /\s\|\s/u.test(line) || /\|\s*(tee|grep|head|tail|sed|awk|xargs)\b/u.test(line));
              occurrences.push({ file, runLine: block.start + 1, pipelineLines });
              const filtered = commands.filter((line) => {
                const trimmed = line.trim();
                return trimmed !== 'set -o pipefail' && trimmed !== 'set -euo pipefail';
              });
              lines.splice(
                block.start + 1,
                block.end - block.start - 1,
                `${commandIndent}set -euo pipefail`,
                ...filtered,
              );
            }
            fs.writeFileSync(file, lines.join('\n'));
          }

          console.log('=== WORKFLOW PIPE AUDIT ===');
          console.log(`WORKFLOW FILES AUDITED: ${workflowFiles.length}`);
          console.log(`PIPELINE RUN BLOCKS FOUND: ${occurrences.length}`);
          for (const occurrence of occurrences) {
            console.log(`PIPELINE BLOCK: ${occurrence.file}:${occurrence.runLine}`);
            for (const pipeline of occurrence.pipelineLines) {
              console.log(`  PIPE: ${occurrence.file}:${pipeline.number}: ${pipeline.line}`);
            }
          }

          const capturePath = 'scripts/capture-m11-hhr-respecified-evidence.mjs';
          let capture = fs.readFileSync(capturePath, 'utf8');
          const medianBlock = `function median(values) {\n  const sorted = [...values].sort((a, b) => a - b);\n  const middle = Math.floor(sorted.length / 2);\n  return sorted.length % 2 === 0 ? (sorted[middle - 1] + sorted[middle]) / 2 : sorted[middle];\n}\n`;
          const summaryBlock = `${medianBlock}\nfunction diagnosticSummary(values) {\n  if (values.length === 0) {\n    return Object.freeze({\n      count: 0, min: null, max: null, mean: null, standardDeviation: null,\n      p10: null, p50: null, p90: null,\n    });\n  }\n  const sorted = [...values].sort((left, right) => left - right);\n  const average = values.reduce((sum, value) => sum + value, 0) / values.length;\n  const standardDeviation = values.length === 1\n    ? 0\n    : Math.sqrt(values.reduce((sum, value) => sum + (value - average) ** 2, 0) / (values.length - 1));\n  const quantile = (probability) => {\n    const index = (sorted.length - 1) * probability;\n    const lower = Math.floor(index);\n    const upper = Math.ceil(index);\n    return lower === upper\n      ? sorted[lower]\n      : sorted[lower] + (sorted[upper] - sorted[lower]) * (index - lower);\n  };\n  return Object.freeze({\n    count: values.length, min: sorted[0], max: sorted.at(-1), mean: average, standardDeviation,\n    p10: quantile(0.10), p50: quantile(0.50), p90: quantile(0.90),\n  });\n}\n`;
          if (!capture.includes('function diagnosticSummary(values)')) {
            if (!capture.includes(medianBlock)) throw new Error('Capture median insertion anchor drifted.');
            capture = capture.replace(medianBlock, summaryBlock);
          }

          const oldCaptureGate = `rows.sort((left, right) => left.date.localeCompare(right.date) || left.gameId - right.gameId || left.playerId - right.playerId);\nif (rows.length < 500) throw new Error(\`Respecified HHR fit requires at least 500 complete rows; received \${rows.length}.\`);\nconst excludedRowCount = Object.values(exclusionCounts).reduce((sum, count) => sum + count, 0);\nif (excludedRowCount + rows.length !== stats.length) {\n  throw new Error(\`Exclusion conservation failed: \${excludedRowCount} + \${rows.length} != \${stats.length}.\`);\n}\n`;
          const newCaptureGate = `rows.sort((left, right) => left.date.localeCompare(right.date) || left.gameId - right.gameId || left.playerId - right.playerId);\nconst excludedRowCount = Object.values(exclusionCounts).reduce((sum, count) => sum + count, 0);\nconst predictorSummaries = Object.freeze({\n  contextHitQualityLogit: diagnosticSummary(rows.map((row) => row.derivedPredictors.contextHitQualityLogit)),\n  centeredLineupSlot: diagnosticSummary(rows.map((row) => row.derivedPredictors.centeredLineupSlot)),\n  platoonSplitCell: diagnosticSummary(rows.map((row) => row.conditioningInputs.platoonSplitCell)),\n  opposingStarterPooling: diagnosticSummary(rows.map((row) => row.conditioningInputs.opposingStarterPooling)),\n  teamImpliedRunTotal: diagnosticSummary(rows.map((row) => row.conditioningInputs.teamImpliedRunTotal)),\n  precedingLineupSlotsOnBaseQuality: diagnosticSummary(rows.map((row) => row.conditioningInputs.precedingLineupSlotsOnBaseQuality)),\n  expectedPlateAppearances: diagnosticSummary(rows.map((row) => row.conditioningInputs.expectedPlateAppearances)),\n});\n`;
          if (capture.includes(oldCaptureGate)) {
            capture = capture.replace(oldCaptureGate, newCaptureGate);
          } else if (!capture.includes('const predictorSummaries = Object.freeze({')) {
            throw new Error('Capture gate replacement anchor drifted.');
          }
          const exclusionProperty = `  exclusionCounts,\n  exclusionCountSum: excludedRowCount,\n`;
          if (!capture.includes('  predictorSummaries,\n')) {
            if (!capture.includes(exclusionProperty)) throw new Error('Capture predictor-summary property anchor drifted.');
            capture = capture.replace(exclusionProperty, `${exclusionProperty}  predictorSummaries,\n`);
          }
          const captureEnd = `console.log('=== END M11 HHR RESPECIFIED EVIDENCE ===');`;
          const persistedGates = `${captureEnd}\n\nif (excludedRowCount + rows.length !== stats.length) {\n  throw new Error(\`Exclusion conservation failed after diagnostic persistence: \${excludedRowCount} + \${rows.length} != \${stats.length}.\`);\n}\nif (rows.length < 500) {\n  throw new Error(\`Respecified HHR fit requires at least 500 complete rows after diagnostic persistence; received \${rows.length}.\`);\n}`;
          if (!capture.includes('Exclusion conservation failed after diagnostic persistence')) {
            if (!capture.includes(captureEnd)) throw new Error('Capture persistence-gate anchor drifted.');
            capture = capture.replace(captureEnd, persistedGates);
          }
          fs.writeFileSync(capturePath, capture);

          const fitPath = 'scripts/fit-m11-batter-hhr-respecified.mjs';
          let fit = fs.readFileSync(fitPath, 'utf8');
          const parseAnchor = `const fixture = JSON.parse(fixtureText);\nconst board = JSON.parse(boardText);\n`;
          const prefitBlock = `${parseAnchor}await mkdir(path.dirname(DIAGNOSTICS_PATH), { recursive: true });\nconst prefitDiagnosticsIdentity = {\n  diagnosticsVersion: 1,\n  modelVersion: 'm11-batter-hhr-direct-composite-v1',\n  status: 'pre-fit-contract-validation',\n  sourceFixtureSha256: sha256(fixtureText),\n  rowCount: Array.isArray(fixture.rows) ? fixture.rows.length : null,\n  gameCount: Number.isInteger(fixture.gameCount) ? fixture.gameCount : null,\n  predictorSummaries: fixture.predictorSummaries ?? null,\n  exclusionCounts: fixture.exclusionCounts ?? null,\n  excludedRowCount: Number.isInteger(fixture.excludedRowCount) ? fixture.excludedRowCount : null,\n  exclusionCountSum: Number.isInteger(fixture.exclusionCountSum) ? fixture.exclusionCountSum : null,\n  acceptanceGates: null,\n};\nconst prefitDiagnostics = {\n  ...prefitDiagnosticsIdentity,\n  diagnosticsSha256: sha256(JSON.stringify(prefitDiagnosticsIdentity)),\n};\nawait writeFile(DIAGNOSTICS_PATH, \`${'${JSON.stringify(prefitDiagnostics, null, 2)}'}\\n\`);\n`;
          if (!fit.includes('status: \'pre-fit-contract-validation\'')) {
            if (!fit.includes(parseAnchor)) throw new Error('Fit prefit-diagnostics anchor drifted.');
            fit = fit.replace(parseAnchor, prefitBlock);
          }

          const oldFitPersistence = `await mkdir(path.dirname(MODEL_PATH), { recursive: true });\nawait writeFile(DIAGNOSTICS_PATH, \`${'${JSON.stringify(diagnostics, null, 2)}'}\\n\`);\nawait writeFile(MODEL_PATH, \`${'${JSON.stringify(model, null, 2)}'}\\n\`);\n\nconsole.log('=== M11 HHR RESPECIFIED FIT ===');`;
          const newFitPersistence = `await writeFile(DIAGNOSTICS_PATH, \`${'${JSON.stringify(diagnostics, null, 2)}'}\\n\`);\n\nconsole.log('=== M11 HHR RESPECIFIED FIT ===');`;
          if (fit.includes(oldFitPersistence)) {
            fit = fit.replace(oldFitPersistence, newFitPersistence);
          } else if (fit.indexOf('await writeFile(MODEL_PATH') < fit.indexOf('if (!gates.vif.passed)')) {
            throw new Error('Fit model persistence still precedes acceptance gates.');
          }
          const finalGate = `if (!gates.batterQualitySpread.passed) throw new Error(\`GATE C FAILED: minimum quality ratio \${gates.batterQualitySpread.minimumObservedRatio} is below \${QUALITY_SPREAD_MINIMUM_RATIO}.\`);`;
          if (!fit.includes('MODEL PERSISTED AFTER GATES: true')) {
            if (!fit.includes(finalGate)) throw new Error('Fit final-gate anchor drifted.');
            fit = fit.replace(finalGate, `${finalGate}\nawait writeFile(MODEL_PATH, \`${'${JSON.stringify(model, null, 2)}'}\\n\`);\nconsole.log('MODEL PERSISTED AFTER GATES: true');`);
          }
          fs.writeFileSync(fitPath, fit);

          for (const file of workflowFiles) {
            const text = fs.readFileSync(file, 'utf8');
            for (const block of shellRunBlocks(text)) {
              if (!blockHasPipeline(block.lines, block.start, block.end)) continue;
              const firstCommand = block.lines.slice(block.start + 1, block.end)
                .map((line) => line.trim())
                .find((line) => line && !line.startsWith('#'));
              if (firstCommand !== 'set -euo pipefail') {
                throw new Error(`Workflow pipeline block is not fail-closed: ${file}:${block.start + 1}`);
              }
            }
          }

          const persistedCapture = fs.readFileSync(capturePath, 'utf8');
          if (!(persistedCapture.indexOf('await writeFile(DESIGN_PATH') < persistedCapture.indexOf('after diagnostic persistence; received'))) {
            throw new Error('Capture minimum still precedes design-matrix persistence.');
          }
          const persistedFit = fs.readFileSync(fitPath, 'utf8');
          if (!(persistedFit.indexOf("status: 'pre-fit-contract-validation'") < persistedFit.indexOf('fixture.rows.length < 500'))) {
            throw new Error('Fit prefit diagnostics still follow the row minimum.');
          }
          if (!(persistedFit.lastIndexOf('await writeFile(DIAGNOSTICS_PATH') < persistedFit.indexOf('if (!gates.vif.passed)'))) {
            throw new Error('Full fit diagnostics do not precede acceptance gates.');
          }
          if (!(persistedFit.indexOf('if (!gates.batterQualitySpread.passed)') < persistedFit.lastIndexOf('await writeFile(MODEL_PATH'))) {
            throw new Error('Model artifact persistence still precedes Gate C.');
          }
          console.log('WORKFLOW PIPE BLOCKS FAIL-CLOSED: true');
          console.log('CAPTURE DIAGNOSTICS BEFORE MINIMUM: true');
          console.log('FIT PREFIT DIAGNOSTICS BEFORE MINIMUM: true');
          console.log('FIT FULL DIAGNOSTICS BEFORE GATES: true');
          console.log('MODEL PERSISTENCE AFTER GATES: true');
          console.log('=== END WORKFLOW PIPE AUDIT ===');
          NODE

      - name: Verify focused changes without capture or fit
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          node --check scripts/capture-m11-hhr-respecified-evidence.mjs
          node --check scripts/fit-m11-batter-hhr-respecified.mjs
          npm run typecheck
          npm run check:scripts
          git diff --check
          git diff -- .github/workflows scripts/capture-m11-hhr-respecified-evidence.mjs scripts/fit-m11-batter-hhr-respecified.mjs

      - name: Remove temporary workflow and commit fixes
        run: |
          set -euo pipefail
          rm .github/workflows/m11-step2-source-trace-failclosed-fixes.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/capture-m11-hhr-respecified-evidence.mjs scripts/fit-m11-batter-hhr-respecified.mjs
          git commit -m "Harden HHR diagnostics and workflow failures"
          git push origin HEAD:agent/m11-step2-hhr-respecification
