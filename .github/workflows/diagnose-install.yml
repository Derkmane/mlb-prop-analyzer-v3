name: diagnose-install

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture dependency installation
        run: |
          set +e
          npm install --ignore-scripts > npm-install.log 2>&1
          echo "$?" > npm-install-status.txt
          exit 0
      - name: Upload installation diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-diagnostic
          path: |
            npm-install.log
            npm-install-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report installation result
        run: exit "$(cat npm-install-status.txt)"
