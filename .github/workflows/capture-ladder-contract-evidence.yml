name: Capture Pick6 and DraftKings ladder contract evidence

on:
  push:
    branches:
      - codex/pick6-draftkings-ladders

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/pick6-draftkings-ladders
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture and sanitize verified live ladder evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const key = process.env.THE_ODDS_API_KEY;
          if (!key) throw new Error('THE_ODDS_API_KEY is unavailable.');

          const targetMarkets = [
            'batter_hits',
            'batter_hits_alternate',
            'batter_hits_runs_rbis',
            'batter_hits_runs_rbis_alternate',
            'batter_total_bases',
            'batter_total_bases_alternate',
          ];
          const sources = [
            { source: 'pick6', region: 'us_dfs', bookmaker: 'pick6' },
            { source: 'draftkings', region: 'us', bookmaker: 'draftkings' },
          ];
          const api = 'https://api.the-odds-api.com/v4/sports/baseball_mlb';
          const hash = (value) => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const getJson = async (url) => {
            const response = await fetch(url);
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text.slice(0,400)}`);
            return JSON.parse(text);
          };

          const eventsUrl = new URL(`${api}/events`);
          eventsUrl.searchParams.set('apiKey', key);
          eventsUrl.searchParams.set('dateFormat', 'iso');
          const events = await getJson(eventsUrl);
          const now = Date.now();
          const upcoming = events
            .filter((event) => Number.isFinite(Date.parse(event.commence_time)) && Date.parse(event.commence_time) > now)
            .sort((a,b) => Date.parse(a.commence_time)-Date.parse(b.commence_time));
          if (upcoming.length === 0) throw new Error('No upcoming MLB events were returned.');

          const evidence = new Map();
          const requestLog = [];
          for (const source of sources) {
            let firstTarget = null;
            let firstSuccessful = null;
            for (const event of upcoming.slice(0, 12)) {
              const url = new URL(`${api}/events/${event.id}/odds`);
              url.searchParams.set('apiKey', key);
              url.searchParams.set('regions', source.region);
              url.searchParams.set('bookmakers', source.bookmaker);
              url.searchParams.set('markets', targetMarkets.join(','));
              url.searchParams.set('dateFormat', 'iso');
              url.searchParams.set('oddsFormat', 'american');
              url.searchParams.set('includeMultipliers', 'true');
              try {
                const body = await getJson(url);
                if (firstSuccessful === null) firstSuccessful = {event, body};
                const bookmakerRows = Array.isArray(body.bookmakers)
                  ? body.bookmakers.filter((row) => row?.key === source.bookmaker)
                  : [];
                const markets = bookmakerRows.flatMap((row) => Array.isArray(row.markets) ? row.markets : []);
                const targetOutcomeCount = markets
                  .filter((market) => targetMarkets.includes(market.key))
                  .reduce((sum, market) => sum + (Array.isArray(market.outcomes) ? market.outcomes.length : 0), 0);
                requestLog.push({source:source.source,eventId:event.id,status:'ok',targetOutcomeCount});
                if (targetOutcomeCount > 0) {
                  firstTarget = {event, body};
                  break;
                }
              } catch (error) {
                requestLog.push({source:source.source,eventId:event.id,status:'error',message:String(error.message)});
              }
            }
            const selected = firstTarget ?? firstSuccessful;
            if (selected === null) throw new Error(`No successful ${source.source} response was available for evidence.`);
            evidence.set(source.source, {source, ...selected, hasTargetOutcomes: firstTarget !== null});
          }

          const summarize = ({source,event,body,hasTargetOutcomes}) => {
            const bookmakers = Array.isArray(body.bookmakers)
              ? body.bookmakers.filter((row) => row?.key === source.bookmaker)
              : [];
            const markets = bookmakers.flatMap((row) => Array.isArray(row.markets) ? row.markets : [])
              .filter((market) => targetMarkets.includes(market.key));
            return {
              source: source.source,
              region: source.region,
              bookmaker: source.bookmaker,
              eventId: event.id,
              commenceTime: event.commence_time,
              targetOffersAvailable: hasTargetOutcomes,
              bookmakerCount: bookmakers.length,
              markets: markets.map((market) => {
                const outcomes = Array.isArray(market.outcomes) ? market.outcomes : [];
                const tupleCounts = new Map();
                for (const outcome of outcomes) {
                  const tuple = JSON.stringify([outcome.description, market.key, outcome.point, outcome.name]);
                  tupleCounts.set(tuple, (tupleCounts.get(tuple) ?? 0) + 1);
                }
                return {
                  key: market.key,
                  outcomeCount: outcomes.length,
                  uniquePlayers: new Set(outcomes.map((o) => o.description)).size,
                  sides: [...new Set(outcomes.map((o) => o.name))].sort(),
                  uniquePoints: [...new Set(outcomes.map((o) => o.point))].sort((a,b) => a-b),
                  exactDuplicateRows: [...tupleCounts.values()].reduce((sum,n) => sum + Math.max(0,n-1),0),
                  pricePresence: [...new Set(outcomes.map((o) => Object.hasOwn(o,'price') ? typeof o.price : 'absent'))].sort(),
                  multiplierPresence: [...new Set(outcomes.map((o) => Object.hasOwn(o,'multiplier') ? typeof o.multiplier : 'absent'))].sort(),
                  sidPresence: [...new Set(outcomes.map((o) => Object.hasOwn(o,'sid') ? (o.sid === null ? 'null' : typeof o.sid) : 'absent'))].sort(),
                };
              }).sort((a,b) => a.key.localeCompare(b.key)),
            };
          };
          const sanitize = (value) => ({
            request: {
              provider: 'The Odds API',
              sport: 'baseball_mlb',
              region: value.source.region,
              bookmaker: value.source.bookmaker,
              marketKeys: targetMarkets,
              dateFormat: 'iso',
              oddsFormat: 'american',
              includeMultipliers: true,
            },
            targetOffersAvailable: value.hasTargetOutcomes,
            eventIdentity: {
              id: value.event.id,
              commence_time: value.event.commence_time,
              home_team: value.event.home_team,
              away_team: value.event.away_team,
            },
            responseSha256: hash(value.body),
            response: value.body,
          });

          const diagnostics = sources.map((source) => summarize(evidence.get(source.source)));
          const fixture = {
            fixtureVersion: 1,
            capturedAt: new Date().toISOString(),
            provider: 'The Odds API',
            targetMarkets,
            responsePaths: {
              event: 'response',
              bookmakers: 'response.bookmakers[]',
              markets: 'response.bookmakers[].markets[]',
              outcomes: 'response.bookmakers[].markets[].outcomes[]',
            },
            pick6: sanitize(evidence.get('pick6')),
            draftkings: sanitize(evidence.get('draftkings')),
            diagnostics,
            requestLog,
          };

          fs.mkdirSync('fixtures/sanitized/the-odds-api',{recursive:true});
          fs.writeFileSync('fixtures/sanitized/the-odds-api/pick6-draftkings-ladder-v1.json', `${JSON.stringify(fixture,null,2)}\n`);
          fs.mkdirSync('docs/providers',{recursive:true});
          fs.writeFileSync('docs/providers/pick6-draftkings-ladder-contract-v1.md', [
            '# Pick6 + DraftKings ladder provider contract — v1',
            '',
            `Captured: ${fixture.capturedAt}`,
            '',
            'Provider: The Odds API. Secrets and request API keys are not stored.',
            '',
            'Verified request contracts:',
            '- Pick6: region `us_dfs`, bookmaker `pick6`.',
            '- DraftKings Sportsbook: region `us`, bookmaker `draftkings`.',
            `- Markets: ${targetMarkets.map((x)=>'`'+x+'`').join(', ')}.`,
            '- `includeMultipliers=true`, `dateFormat=iso`, `oddsFormat=american`.',
            '',
            'Verified JSON paths:',
            '- event: `response`',
            '- bookmakers: `response.bookmakers[]`',
            '- markets: `response.bookmakers[].markets[]`',
            '- outcomes: `response.bookmakers[].markets[].outcomes[]`',
            '',
            'Observed live availability and shape:',
            '```json',
            JSON.stringify(diagnostics,null,2),
            '```',
            '',
            'Contract behavior:',
            '- Preserve source identity, event identity, provider market key, numerical point, exact posted side, price/multiplier when present, market timestamp, and snapshot lineage.',
            '- Provider offer type comes only from exact base versus `_alternate` market key.',
            '- Product Altline identity requires a numerically different rung from the unique same-source baseline.',
            '- Pick6 exact duplicate tuples `(player, market, point, name)` may be deduplicated by keeping the first identical row; the observed duplication count remains diagnostic.',
            '- Missing source availability, sides, markets, and rungs remain absent. No mirroring, synthesis, cross-source borrowing, or standard-book baseline inference.',
            '- Price, multiplier, payout, and implied probability are evidence/display only and do not rank.',
            '- A source returning no target offers is a normal fail-closed availability state, not permission to substitute another source.',
            '',
            `Pick6 response SHA-256: \`${fixture.pick6.responseSha256}\``,
            `DraftKings response SHA-256: \`${fixture.draftkings.responseSha256}\``,
            '',
          ].join('\n'));
          NODE
          rm .github/workflows/capture-ladder-contract-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/sanitized/the-odds-api/pick6-draftkings-ladder-v1.json docs/providers/pick6-draftkings-ladder-contract-v1.md .github/workflows/capture-ladder-contract-evidence.yml
          git diff --cached --check
          git commit -m "docs: preserve verified Pick6 and DraftKings ladder evidence"
          git push origin HEAD:codex/pick6-draftkings-ladders