name: M11 step 2 historical access-window probe

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe exact historical timestamp grid
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const apiKey = process.env.THE_ODDS_API_KEY?.trim();
          if (!apiKey) throw new Error('Missing THE_ODDS_API_KEY.');
          const timestamps = [
            '2026-07-19T23:00:00Z',
            '2026-07-20T00:00:00Z',
            '2026-07-20T06:00:00Z',
            '2026-07-20T12:00:00Z',
            '2026-07-20T17:00:00Z',
            '2026-07-20T18:00:00Z',
            '2026-07-20T23:00:00Z',
            '2026-07-21T00:00:00Z',
            '2026-07-21T06:00:00Z',
            '2026-07-21T12:00:00Z',
            '2026-07-21T17:00:00Z',
            '2026-07-22T00:00:00Z',
          ];
          const results = [];
          for (const timestamp of timestamps) {
            const url = new URL('https://api.the-odds-api.com/v4/historical/sports/baseball_mlb/events');
            url.searchParams.set('apiKey', apiKey);
            url.searchParams.set('date', timestamp);
            url.searchParams.set('dateFormat', 'iso');
            const response = await fetch(url);
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            const data = Array.isArray(body?.data) ? body.data : Array.isArray(body) ? body : null;
            results.push({
              timestamp,
              httpStatus: response.status,
              valid: response.ok,
              eventCount: data?.length ?? null,
              returnedTimestamp: body?.timestamp ?? null,
              errorCode: body?.error_code ?? null,
              message: body?.message ?? null,
              requestsLast: response.headers.get('x-requests-last'),
              requestsRemaining: response.headers.get('x-requests-remaining'),
            });
            console.log(`${timestamp}\t${response.status}\t${body?.error_code ?? 'OK'}\t${data?.length ?? 'n/a'}`);
          }
          const valid = results.filter((row) => row.valid);
          const report = {
            schemaVersion: 1,
            provider: 'The Odds API',
            endpoint: '/v4/historical/sports/baseball_mlb/events',
            probedAt: new Date().toISOString(),
            results,
            earliestValidTimestampInGrid: valid.at(0)?.timestamp ?? null,
            latestValidTimestampInGrid: valid.at(-1)?.timestamp ?? null,
          };
          const output = 'fixtures/sanitized/m11/hhr/provider-contracts/historical-window-boundary.json';
          fs.mkdirSync(path.dirname(output), { recursive: true });
          fs.writeFileSync(output, `${JSON.stringify(report, null, 2)}\n`);
          NODE
      - name: Remove temporary probe workflow
        run: rm .github/workflows/m11-step2-historical-window-probe.yml
      - name: Commit retained access-window evidence
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record HHR historical access window"
          git push origin HEAD:agent/m11-step2-hhr-respecification
