name: m9-correct-archive-evidence

on:
  push:
    branches:
      - agent/m9-live-archive-grading-clean
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  correct:
    if: github.ref_name == 'agent/m9-live-archive-grading-clean' || github.head_ref == 'agent/m9-live-archive-grading-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out M9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/m9-live-archive-grading-clean
          fetch-depth: 0

      - name: Correct checklist evidence status without rewriting archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('PROJECT_CHECKLIST.md')
          text = path.read_text()
          old_item = """- [x] Begin prospective board archiving and grading — the live July 31, 2026 Underdog Batter Hits board was captured through the connected frozen M8 runtime into one immutable 30-row archive at `artifacts/board-archives/batter-hits/2026-07-31.json`, archive SHA-256 `ae8803b5625662e483f1b6f52e715f55a671a3c9d777ae7ec1aa65fda1bedc8c`. Exact player, game, market, side, line, probabilities, complete distributions, model versions, settlement version, and provider snapshot hashes were preserved. The official-Hits grader uses exact provider game and player IDs, settles Higher/Lower including integer-line voids, refuses to persist incomplete grading, and reported 30 pending, 0 unresolved rows while the game was not final. Archive and grading tests passed 10 of 10; the integrated focused gate passed 24 of 24 and the complete repository verification passed 360 of 360. Production ranking remained disabled and untouched-test rows remained sealed."""
          new_item = """- [x] Implement prospective board archiving and grading — the archiver preserves exact offer identity, complete distributions, model and settlement versions, provider snapshot hashes, and immutable-per-date behavior; the official-Hits grader uses exact provider game and player IDs, settles Higher/Lower including integer-line voids, and refuses to persist incomplete grading. Archive and grading tests passed 10 of 10; the integrated focused gate passed 24 of 24 and the complete repository verification passed 360 of 360. Production ranking remained disabled and untouched-test rows remained sealed.
- [ ] Preserve and verify the July 31 live archive evidence — the live runtime reported 30 rows at `artifacts/board-archives/batter-hits/2026-07-31.json` with claimed SHA-256 `ae8803b5625662e483f1b6f52e715f55a671a3c9d777ae7ec1aa65fda1bedc8c`, plus 30 pending and 0 unresolved grading rows before final games. The live script built confirmed-only runtime observations, so the temporary wrapper executed `confirmed` to `confirmed`; no projected row was coerced. The exact archive bytes and an immutable repository evidence receipt are not present in this branch, so merge evidence remains incomplete. Recover the original runtime archive and grading artifact unchanged, verify their hashes, and preserve approved immutable evidence; do not regenerate or rewrite the July 31 records."""
          if text.count(old_item) != 1:
              raise SystemExit(f'Expected one archive checklist item, found {text.count(old_item)}')
          text = text.replace(old_item, new_item)

          old_log = """- Began prospective live Underdog Batter Hits board archiving through the connected frozen M8 runtime.
- Preserved one immutable 30-row July 31 archive with SHA-256 `ae8803b5625662e483f1b6f52e715f55a671a3c9d777ae7ec1aa65fda1bedc8c`.
- Added official BALLDONTLIE final-game Hits grading using exact archived game and player identities and exact Higher/Lower settlement.
- Verified that incomplete games remain pending and do not create a permanent grade sidecar; the initial live run reported 30 pending and 0 unresolved rows.
- Recorded 10-of-10 archive/grading tests, 24-of-24 integrated focused tests, and 360-of-360 complete repository tests passing.
- Preserved the connected M8 model, production-disabled status, and sealed untouched-test boundary."""
          new_log = """- Implemented prospective live Underdog Batter Hits board archiving through the connected frozen M8 runtime and official BALLDONTLIE final-game Hits grading.
- Recorded the July 31 runtime report of 30 rows at `artifacts/board-archives/batter-hits/2026-07-31.json` with claimed SHA-256 `ae8803b5625662e483f1b6f52e715f55a671a3c9d777ae7ec1aa65fda1bedc8c`.
- Verified from the live code path that July 31 used confirmed-only runtime observations; no projected lineup row was coerced to confirmed.
- Left exact July 31 archive-byte recovery and immutable evidence preservation open because those bytes are not present in the repository branch; regeneration or rewriting is prohibited.
- Verified that incomplete games remain pending and do not create a permanent grade sidecar; the initial live run reported 30 pending and 0 unresolved rows.
- Recorded 10-of-10 archive/grading tests, 24-of-24 integrated focused tests, and 360-of-360 complete repository tests passing while preserving the connected M8 model, production-disabled status, and sealed untouched-test boundary."""
          if text.count(old_log) != 1:
              raise SystemExit(f'Expected one archive changelog block, found {text.count(old_log)}')
          path.write_text(text.replace(old_log, new_log))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m9-correct-archive-evidence.yml
          git add PROJECT_CHECKLIST.md
          git commit -m 'Correct July 31 archive evidence status'
          git push origin HEAD:agent/m9-live-archive-grading-clean
