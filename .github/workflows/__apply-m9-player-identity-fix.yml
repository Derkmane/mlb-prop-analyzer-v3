name: apply-m9-player-identity-fix

on:
  push:
    branches:
      - agent/m9-board-archiving
    paths:
      - scripts/__apply-m9-player-identity-fix.mjs
      - .github/workflows/__apply-m9-player-identity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v6
        with:
          ref: agent/m9-board-archiving
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate guarded transform
        run: node --check scripts/__apply-m9-player-identity-fix.mjs
      - name: Apply exact player lookup correction
        run: node scripts/__apply-m9-player-identity-fix.mjs
      - name: Remove temporary transport files
        run: rm scripts/__apply-m9-player-identity-fix.mjs .github/workflows/__apply-m9-player-identity-fix.yml
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build before focused tests
        run: npm run build
      - name: Run focused player identity and live-boundary tests
        run: node --test test/m9-player-identity-live-path.test.mjs test/m9-board-archive-live-boundary.test.mjs test/m9-board-archive-funnel.test.mjs
      - name: Commit and push scoped correction
        run: |
          git config user.name "Derkmane"
          git config user.email "153403266+Derkmane@users.noreply.github.com"
          git add scripts/archive-m9-batter-hits-board.mjs scripts/__apply-m9-player-identity-fix.mjs .github/workflows/__apply-m9-player-identity-fix.yml
          git commit -m "Resolve live M9 players through exact name lookup"
          git push origin HEAD:agent/m9-board-archiving
