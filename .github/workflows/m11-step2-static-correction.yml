name: M11 step 2 static timestamp correction

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Correct commence-time lineage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/capture-m11-hhr-respecified-evidence.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "const snapshotTime = new Date(Date.parse(game.date) - 6 * 60 * 60 * 1000).toISOString();",
              "const snapshotTime = new Date(Date.parse(game.commenceTime) - 60 * 60 * 1000).toISOString();",
            ],
            [
              "Math.abs(Date.parse(event.commence_time) - Date.parse(game.date)) <= 6 * 60 * 60 * 1000,",
              "Math.abs(Date.parse(event.commence_time) - Date.parse(game.commenceTime)) <= 6 * 60 * 60 * 1000,",
            ],
          ];
          for (const [before, after] of replacements) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`Expected one exact replacement for ${before}; found ${count}.`);
            text = text.replace(before, after);
          }
          fs.writeFileSync(path, text);
          NODE
          node --check scripts/capture-m11-hhr-respecified-evidence.mjs
      - name: Remove temporary correction workflow
        run: rm .github/workflows/m11-step2-static-correction.yml
      - name: Commit correction
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct HHR historical snapshot timestamp"
          git push origin HEAD:agent/m11-step2-hhr-respecification
