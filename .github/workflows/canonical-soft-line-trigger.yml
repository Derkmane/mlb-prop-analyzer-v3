name: canonical-soft-line-trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'agent/canonical-soft-line-definition'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-soft-line-definition
          fetch-depth: 0

      - name: Apply and verify complete canonical replacements
        shell: bash
        run: |
          python scripts/canonical-soft-line-sync.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CANONICAL_MATH_SPEC.md PROJECT_RULES.md "
          grep -F '**Version:** 2.5\' PROJECT_RULES.md
          grep -F '**Version:** 1.6' CANONICAL_MATH_SPEC.md
          grep -F '### Side-aware soft-line discovery --- LOCKED' PROJECT_RULES.md
          grep -F '### 11.1 Base soft-line discovery and final context-adjusted probability' CANONICAL_MATH_SPEC.md

      - name: Commit canonical replacements and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_RULES.md CANONICAL_MATH_SPEC.md
          git rm .github/workflows/canonical-soft-line-sync.yml
          git rm .github/workflows/canonical-soft-line-trigger.yml
          git rm scripts/canonical-soft-line-sync.py
          git commit -m "Define side-aware soft-line canonical rules"
          git push origin HEAD:agent/canonical-soft-line-definition
