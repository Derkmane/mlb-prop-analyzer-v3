name: M11 step 2 respecification preflight

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Check respecified scripts
        run: |
          node --check scripts/capture-m11-hhr-respecified-evidence.mjs
          node --check scripts/fit-m11-batter-hhr-respecified.mjs
      - name: Typecheck
        run: npm run typecheck
