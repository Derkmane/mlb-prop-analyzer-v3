name: diagnose-npm-test-tallies

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-npm-test-tallies.yml

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Make main lockfile runnable without changing main
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package-lock.json')
          original = path.read_text(encoding='utf-8')
          old = 'http://package-firewall.replit.local/npm/'
          new = 'https://registry.npmjs.org/'
          count = original.count(old)
          if count != 47:
              raise RuntimeError(f'expected 47 private URLs, found {count}')
          updated = original.replace(old, new)
          json.loads(original)
          json.loads(updated)
          if updated.replace(new, old) != original:
              raise RuntimeError('non-URL lockfile content changed')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Install main dependencies
        run: npm install --ignore-scripts
      - name: Capture main npm test
        run: |
          set +e
          npm test > main-npm-test.log 2>&1
          echo "$?" > main-npm-test-status.txt
          exit 0
      - name: Upload main npm test output
        uses: actions/upload-artifact@v4
        with:
          name: main-npm-test-tally
          path: |
            main-npm-test.log
            main-npm-test-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report main npm test result
        run: exit "$(cat main-npm-test-status.txt)"

  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pull-request dependencies
        run: npm install --ignore-scripts
      - name: Capture pull-request npm test
        run: |
          set +e
          npm test > pr-npm-test.log 2>&1
          echo "$?" > pr-npm-test-status.txt
          exit 0
      - name: Upload pull-request npm test output
        uses: actions/upload-artifact@v4
        with:
          name: pr-npm-test-tally
          path: |
            pr-npm-test.log
            pr-npm-test-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report pull-request npm test result
        run: exit "$(cat pr-npm-test-status.txt)"
