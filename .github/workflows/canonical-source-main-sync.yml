name: canonical-source-main-sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/canonical-soft-line-definition-main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-only branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-soft-line-definition-main
          fetch-depth: 0

      - name: Copy exact approved canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/canonical-soft-line-definition
          git show origin/agent/canonical-soft-line-definition:PROJECT_RULES.md > /tmp/PROJECT_RULES.md
          git show origin/agent/canonical-soft-line-definition:CANONICAL_MATH_SPEC.md > /tmp/CANONICAL_MATH_SPEC.md
          printf '%s  %s\n' \
            '729e342fef5e3b1ac07de89aa03b0b539dfa2a1df100b759f1265b30a6636d7e' \
            '/tmp/PROJECT_RULES.md' | sha256sum --check
          printf '%s  %s\n' \
            'cd18a6283cb39f8793813aa46b8e43775d2854ce40c7b2719616f8fe603c6457' \
            '/tmp/CANONICAL_MATH_SPEC.md' | sha256sum --check
          cp /tmp/PROJECT_RULES.md PROJECT_RULES.md
          cp /tmp/CANONICAL_MATH_SPEC.md CANONICAL_MATH_SPEC.md
          git rm .github/workflows/canonical-source-main-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_RULES.md CANONICAL_MATH_SPEC.md
          git commit -m 'Define side-aware soft-line canonical rules'
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' CANONICAL_MATH_SPEC.md PROJECT_RULES.md | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:agent/canonical-soft-line-definition-main
