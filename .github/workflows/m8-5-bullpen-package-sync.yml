name: m8-5-bullpen-package-sync
on:
  push:
    branches: [agent/m8-5-team-bullpen-outcome]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m8-5-team-bullpen-outcome
      - name: Wire focused bullpen scripts into package verification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts['check:m8-5-team-bullpen-outcome'] =
            'node --check scripts/m8-5-team-bullpen-outcome-utils.mjs && node --check scripts/evaluate-m8-5-team-bullpen-outcome.mjs';
          if (!packageJson.scripts.verify.includes('check:m8-5-team-bullpen-outcome')) {
            packageJson.scripts.verify = packageJson.scripts.verify.replace(
              ' && npm run architecture',
              ' && npm run check:m8-5-team-bullpen-outcome && npm run architecture',
            );
          }
          packageJson.scripts['evaluate:m8-5-team-bullpen-outcome'] =
            'npm run build && node scripts/evaluate-m8-5-team-bullpen-outcome.mjs';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git commit -m "Wire team bullpen evaluator into repository verification"
          git push
