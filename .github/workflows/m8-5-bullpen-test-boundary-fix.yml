name: m8-5-bullpen-test-boundary-fix
on:
  push:
    branches: [agent/m8-5-team-bullpen-outcome]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m8-5-team-bullpen-outcome
      - name: Fix test import boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/m8-5-team-bullpen-outcome.test.mjs')
          text = path.read_text()
          text = text.replace("import { TERMINAL_PA_CATEGORIES } from '../dist/domain/terminal-pa.js';\n", "")
          text = text.replace(
              "  DEFAULT_M8_5_TEAM_BULLPEN_CANDIDATES,\n",
              "  DEFAULT_M8_5_TEAM_BULLPEN_CANDIDATES,\n  M8_5_TEAM_BULLPEN_TERMINAL_CATEGORIES as TERMINAL_PA_CATEGORIES,\n",
          )
          text = text.replace(
              "    assert.equal(\n      effect.categoryProbabilities.reduce((sum, entry) => sum + entry.probability, 0),\n      1,\n    );",
              "    assert.ok(\n      Math.abs(\n        effect.categoryProbabilities.reduce((sum, entry) => sum + entry.probability, 0) - 1,\n      ) < 1e-12,\n    );",
          )
          path.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/m8-5-team-bullpen-outcome.test.mjs
          git commit -m "Fix bullpen test import boundary"
          git push
