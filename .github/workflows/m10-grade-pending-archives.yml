name: M10 grade pending saved archives

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC (4:00 AM Central during the regular season) is late enough for
    # the normal West Coast slate to finish. Any game that still is not exact
    # STATUS_FINAL is skipped and reconsidered on the next run.
    - cron: '0 9 * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: m10-grade-pending-saved-archives
  cancel-in-progress: false

jobs:
  grade:
    name: Grade final saved Batter Hits and HHR archives
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      M10_ARCHIVE_ROOT: artifacts/board-archives/batter-hits
      M10_HHR_ARCHIVE_ROOT: artifacts/board-archives/batter-hhr
      M10_MULTI_MARKET_CUMULATIVE_ROOT: artifacts/board-archives/cumulative
      M10_ARCHIVE_BOOTSTRAP_ROOT: artifacts/bootstrap/m9-board-archive
      M10_GRADE_ATTEMPT_ID: github-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Restore immutable Batter Hits archive ledger
        id: restore-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m9-board-archive-ledger-

      - name: Restore immutable HHR archive ledger
        id: restore-hhr-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-

      - name: Check whether the Hits ledger needs the verified August 5 seed
        id: ledger-state
        run: |
          set -euo pipefail
          if find artifacts/board-archives/batter-hits/captures -maxdepth 1 -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            echo 'needs-bootstrap=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs-bootstrap=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified August 5 source archive
        if: steps.ledger-state.outputs.needs-bootstrap == 'true'
        uses: actions/download-artifact@v4
        with:
          name: m9-board-archive-31017005173
          path: artifacts/bootstrap/m9-board-archive
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Derkmane/mlb-prop-analyzer-v3
          run-id: 31017005173

      - name: Bootstrap empty Hits ledger from verified immutable archive
        if: steps.ledger-state.outputs.needs-bootstrap == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/bootstrap-m10-archive-ledger.mjs 2>&1 | tee artifacts/workflow-logs/m10-archive-bootstrap-grade.log

      - name: Grade only Batter Hits archives whose exact games are final
        id: grade-batter-hits
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/grade-m10-pending-archives.mjs 2>&1 | tee artifacts/workflow-logs/m10-pending-archive-grade.log

      - name: Grade only HHR archives whose exact games are final and accumulate HHR evidence
        id: grade-hhr
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/grade-m10-hhr-pending-archives.mjs 2>&1 | tee artifacts/workflow-logs/m10-hhr-pending-archive-grade.log

      - name: Persist HHR cumulative display evidence
        if: always() && steps.grade-hhr.outcome == 'success'
        run: |
          set -euo pipefail
          SOURCE_DIR="artifacts/board-archives/batter-hhr/cumulative"
          DISPLAY_DIR="artifacts/display-archives/batter-hhr/cumulative"
          if ! find "${SOURCE_DIR}" -maxdepth 1 -type f -name 'm10-hhr-cumulative-selected-side-v1--*.json' -print -quit 2>/dev/null | grep -q .; then
            echo "No HHR cumulative report to persist; clean no-op."
            exit 0
          fi
          mkdir -p "${DISPLAY_DIR}"
          DISPLAY_PATH="$(node -e 'const fs=require("node:fs"),path=require("node:path");const sourceDir="artifacts/board-archives/batter-hhr/cumulative",displayDir="artifacts/display-archives/batter-hhr/cumulative",prefix="m10-hhr-cumulative-selected-side-v1--",sha=/^[a-f0-9]{64}$/u;const names=fs.readdirSync(sourceDir).filter((name)=>name.startsWith(prefix)&&name.endsWith(".json"));const candidates=[];for(const name of names){try{const report=JSON.parse(fs.readFileSync(path.join(sourceDir,name),"utf8"));const generatedAtMs=Date.parse(report.generatedAt);if(!Number.isFinite(generatedAtMs)||!sha.test(report.sourceSetSha256))throw new Error("minimal metadata invalid");candidates.push({name,generatedAt:report.generatedAt,generatedAtMs,sourceSetSha256:report.sourceSetSha256});}catch(error){const reason=error instanceof Error?error.message:String(error);console.error(`SKIPPED HHR CUMULATIVE CANDIDATE\t${name}\t${reason}`);}}if(candidates.length===0)throw new Error("No parseable HHR cumulative report candidates found.");candidates.sort((a,b)=>a.generatedAtMs-b.generatedAtMs||a.sourceSetSha256.localeCompare(b.sourceSetSha256));const selectedCandidate=candidates.at(-1),name=selectedCandidate.name,report=JSON.parse(fs.readFileSync(path.join(sourceDir,name),"utf8"));if(report.reportVersion!==1||report.reportType!=="m10-hhr-cumulative-selected-side-v1")throw new Error(`Unsupported HHR cumulative report: ${name}`);if(!sha.test(report.sourceSetSha256)||name!==`${prefix}${report.sourceSetSha256}.json`)throw new Error(`HHR cumulative source identity mismatch: ${name}`);if(!Number.isFinite(Date.parse(report.generatedAt)))throw new Error(`HHR cumulative generatedAt is invalid: ${name}`);if(report.safety?.productionEnabled!==false||report.safety?.rankingEnabled!==false||report.safety?.evidenceOnly!==true||report.safety?.ownerDecisionRequired!==true||report.safety?.archivesModified!==false)throw new Error(`HHR cumulative safety boundary drifted: ${name}`);for(const cohort of ["0.5","1.5","2.5+"]){const line=report.selectedSide?.perLine?.[cohort];if(line?.lineCohort!==cohort||line?.ownerDecisionRequired!==true||line?.productionEnabled!==false||line?.rankingEnabled!==false)throw new Error(`HHR cumulative line evidence drifted: ${name} ${cohort}`);}console.error(`SELECTED HHR CUMULATIVE REPORT\t${name}\t${report.generatedAt}`);const selected=report.selectedSide;const display={displayEvidenceVersion:1,displayEvidenceContract:"phase3-hhr-cumulative-display-v1",sourceReportVersion:report.reportVersion,sourceReportType:report.reportType,generatedAt:report.generatedAt,sourceSetSha256:report.sourceSetSha256,archivesIncluded:report.archivesIncluded,selectedSide:{deduplicationVersion:selected.deduplicationVersion,deduplicationIdentity:selected.deduplicationIdentity,deduplicationWinnerRule:selected.deduplicationWinnerRule,selectedSideRowsBeforeDedup:selected.selectedSideRowsBeforeDedup,retainedSelectedSideRows:selected.retainedSelectedSideRows,supersededSelectedSideRows:selected.supersededSelectedSideRows,calibrationEligiblePicksBeforeDedup:selected.calibrationEligiblePicksBeforeDedup,summary:selected.summary,calibrationEligiblePicks:selected.calibrationEligiblePicks,calibration:selected.calibration,perLine:selected.perLine},safety:report.safety};const outputPath=path.join(displayDir,`${prefix}${report.sourceSetSha256}.json`),bytes=`${JSON.stringify(display,null,2)}\n`;if(fs.existsSync(outputPath)){if(fs.readFileSync(outputPath,"utf8")!==bytes)throw new Error(`HHR cumulative display evidence drifted: ${outputPath}`);console.error(`VERIFIED HHR CUMULATIVE DISPLAY\t${outputPath}`);}else{fs.writeFileSync(outputPath,bytes,{flag:"wx"});console.error(`CREATED HHR CUMULATIVE DISPLAY\t${outputPath}`);}process.stdout.write(outputPath);')"
          if [ ! -f "${DISPLAY_PATH}" ]; then
            echo "Selected HHR cumulative display path does not exist: ${DISPLAY_PATH}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "HHR cumulative display persistence requires a branch ref; got ${GITHUB_REF_TYPE}."
            exit 1
          fi
          git add -f -- "${DISPLAY_PATH}"
          node -e 'const cp=require("node:child_process");const staged=cp.execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split(/\r?\n/u).filter(Boolean);const allowed=/^artifacts\/display-archives\/batter-hhr\/cumulative\/m10-hhr-cumulative-selected-side-v1--[a-f0-9]{64}\.json$/u;const invalid=staged.filter((value)=>!allowed.test(value));if(invalid.length>0)throw new Error(`Refusing to persist non-HHR-display paths: ${invalid.join(", ")}`);if(staged.length>1)throw new Error(`Expected at most one new HHR cumulative display report; staged ${staged.length}.`);console.log(`STAGED HHR CUMULATIVE DISPLAY REPORTS\t${staged.length}`);'
          if git diff --cached --quiet; then
            echo "HHR cumulative display evidence already persisted; no commit required."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: persist HHR cumulative display evidence [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build Batter Hits selected-side and cumulative grading evidence
        run: |
          set -euo pipefail
          node scripts/build-m10-selected-side-cumulative-grades.mjs 2>&1 | tee artifacts/workflow-logs/m10-selected-side-cumulative-grade.log

      - name: Build combined Batter Hits and HHR cumulative selected-side evidence
        run: |
          set -euo pipefail
          node scripts/build-m10-multi-market-cumulative-grades.mjs 2>&1 | tee artifacts/workflow-logs/m10-multi-market-cumulative-grade.log

      - name: Save immutable Batter Hits archive and grade ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable HHR archive and grade ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload immutable grades, status evidence, cumulative evidence, and provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-pending-archive-grades-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifacts/board-archives/batter-hits/**
            artifacts/board-archives/batter-hhr/**
            artifacts/board-archives/cumulative/**

      - name: Upload full grading logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-pending-archive-grade-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/workflow-logs/m10-*-grade.log

      - name: Persist small cumulative grading report to repository
        if: always()
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Cumulative grading persistence requires a branch ref; got ${GITHUB_REF_TYPE}."
            exit 1
          fi
          git add -f -- artifacts/board-archives/cumulative/m10-multi-market-cumulative-selected-side-v2--*.json
          node -e 'const cp=require("node:child_process");const staged=cp.execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split(/\r?\n/u).filter(Boolean);const allowed=/^artifacts\/board-archives\/cumulative\/m10-multi-market-cumulative-selected-side-v2--[a-f0-9]{64}\.json$/u;const invalid=staged.filter((value)=>!allowed.test(value));if(invalid.length>0)throw new Error(`Refusing to persist non-cumulative paths: ${invalid.join(", ")}`);if(staged.length>1)throw new Error(`Expected at most one new cumulative report; staged ${staged.length}.`);console.log(`STAGED CUMULATIVE REPORTS\t${staged.length}`);'
          if git diff --cached --quiet; then
            echo "Cumulative grading report already persisted; no commit required."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: persist cumulative grading display [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve Batter Hits grading failure after HHR evidence
        if: always() && (steps.grade-batter-hits.outcome == 'failure' || steps.grade-hhr.outcome == 'failure')
        run: |
          echo "Batter Hits grading failed earlier; HHR grading and cumulative evidence were allowed to complete."
          exit 1
