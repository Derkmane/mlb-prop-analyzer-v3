name: M10 grade pending saved archives

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC (4:00 AM Central during the regular season) is late enough for
    # the normal West Coast slate to finish. Any game that still is not exact
    # STATUS_FINAL is skipped and reconsidered on the next run.
    - cron: '0 9 * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: m10-grade-pending-saved-archives
  cancel-in-progress: false

jobs:
  grade:
    name: Grade final saved Batter Hits and HHR archives
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      M10_ARCHIVE_ROOT: artifacts/board-archives/batter-hits
      M10_HHR_ARCHIVE_ROOT: artifacts/board-archives/batter-hhr
      M10_MULTI_MARKET_CUMULATIVE_ROOT: artifacts/board-archives/cumulative
      M10_ARCHIVE_BOOTSTRAP_ROOT: artifacts/bootstrap/m9-board-archive
      M10_GRADE_ATTEMPT_ID: github-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      M10_BDL_MIN_REQUEST_INTERVAL_MS: '13000'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Restore immutable Batter Hits archive ledger
        id: restore-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m9-board-archive-ledger-

      - name: Restore immutable HHR archive ledger
        id: restore-hhr-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-

      - name: Check whether the Hits ledger needs the verified August 5 seed
        id: ledger-state
        run: |
          set -euo pipefail
          if find artifacts/board-archives/batter-hits/captures -maxdepth 1 -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            echo 'needs-bootstrap=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs-bootstrap=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified August 5 source archive
        if: steps.ledger-state.outputs.needs-bootstrap == 'true'
        uses: actions/download-artifact@v4
        with:
          name: m9-board-archive-31017005173
          path: artifacts/bootstrap/m9-board-archive
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Derkmane/mlb-prop-analyzer-v3
          run-id: 31017005173

      - name: Bootstrap empty Hits ledger from verified immutable archive
        if: steps.ledger-state.outputs.needs-bootstrap == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/bootstrap-m10-archive-ledger.mjs 2>&1 | tee artifacts/workflow-logs/m10-archive-bootstrap-grade.log

      - name: Grade only Batter Hits archives whose exact games are final
        id: grade-batter-hits
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/grade-m10-pending-archives.mjs 2>&1 | tee artifacts/workflow-logs/m10-pending-archive-grade.log

      - name: Grade only HHR archives whose exact games are final and accumulate HHR evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/grade-m10-hhr-pending-archives.mjs 2>&1 | tee artifacts/workflow-logs/m10-hhr-pending-archive-grade.log

      - name: Build Batter Hits selected-side and cumulative grading evidence
        run: |
          set -euo pipefail
          node scripts/build-m10-selected-side-cumulative-grades.mjs 2>&1 | tee artifacts/workflow-logs/m10-selected-side-cumulative-grade.log

      - name: Build combined Batter Hits and HHR cumulative selected-side evidence
        run: |
          set -euo pipefail
          node scripts/build-m10-multi-market-cumulative-grades.mjs 2>&1 | tee artifacts/workflow-logs/m10-multi-market-cumulative-grade.log

      - name: Save immutable Batter Hits archive and grade ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable HHR archive and grade ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload immutable grades, status evidence, cumulative evidence, and provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-pending-archive-grades-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifacts/board-archives/batter-hits/**
            artifacts/board-archives/batter-hhr/**
            artifacts/board-archives/cumulative/**

      - name: Upload full grading logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-pending-archive-grade-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/workflow-logs/m10-*-grade.log

      - name: Persist small cumulative grading report to repository
        if: success()
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Cumulative grading persistence requires a branch ref; got ${GITHUB_REF_TYPE}."
            exit 1
          fi
          git add -f -- artifacts/board-archives/cumulative/m10-multi-market-cumulative-selected-side-v1--*.json
          node -e 'const cp=require("node:child_process");const staged=cp.execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split(/\r?\n/u).filter(Boolean);const allowed=/^artifacts\/board-archives\/cumulative\/m10-multi-market-cumulative-selected-side-v1--[a-f0-9]{64}\.json$/u;const invalid=staged.filter((value)=>!allowed.test(value));if(invalid.length>0)throw new Error(`Refusing to persist non-cumulative paths: ${invalid.join(", ")}`);if(staged.length>1)throw new Error(`Expected at most one new cumulative report; staged ${staged.length}.`);console.log(`STAGED CUMULATIVE REPORTS\t${staged.length}`);'
          if git diff --cached --quiet; then
            echo "Cumulative grading report already persisted; no commit required."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: persist cumulative grading display [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve Batter Hits grading failure after HHR evidence
        if: always() && steps.grade-batter-hits.outcome == 'failure'
        run: |
          echo "Batter Hits grading failed earlier; HHR grading and cumulative evidence were allowed to complete."
          exit 1
