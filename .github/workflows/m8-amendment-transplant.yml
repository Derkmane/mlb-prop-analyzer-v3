name: m8-amendment-transplant

on:
  push:
    branches:
      - agent/m8-amendment-clean

permissions:
  contents: write

jobs:
  transplant:
    if: github.ref_name == 'agent/m8-amendment-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean M8 amendment branch
        uses: actions/checkout@v4
        with:
          ref: agent/m8-amendment-clean
          fetch-depth: 0

      - name: Transplant only verified M8 amendment files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            agent/m8-c1-projected-lineup-compliance \
            agent/m8-c2-production-seal-gate \
            agent/m8-base-bridge-checklist

          git checkout origin/agent/m8-c1-projected-lineup-compliance -- \
            src/composition/batter-hits-probability.ts \
            src/features/batter-hits/index.ts \
            src/features/batter-hits/runtime-probability.ts \
            test/m9-batter-hits-projected-lineup-equivalence.test.ts

          git rm src/features/batter-hits/runtime-lineup-observation.ts

          git checkout origin/agent/m8-c2-production-seal-gate -- \
            docs/modeling/m8-production-enablement-gate-v1.md

          git checkout origin/agent/m8-base-bridge-checklist -- \
            PROJECT_CHECKLIST.md

          git rm .github/workflows/m8-amendment-transplant.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PROJECT_CHECKLIST.md \
            docs/modeling/m8-production-enablement-gate-v1.md \
            src/composition/batter-hits-probability.ts \
            src/features/batter-hits/index.ts \
            src/features/batter-hits/runtime-probability.ts \
            src/features/batter-hits/runtime-lineup-observation.ts \
            test/m9-batter-hits-projected-lineup-equivalence.test.ts
          git commit -m 'Establish clean M8 amendment base'

          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            PROJECT_CHECKLIST.md \
            docs/modeling/m8-production-enablement-gate-v1.md \
            src/composition/batter-hits-probability.ts \
            src/features/batter-hits/index.ts \
            src/features/batter-hits/runtime-lineup-observation.ts \
            src/features/batter-hits/runtime-probability.ts \
            test/m9-batter-hits-projected-lineup-equivalence.test.ts | sort)"
          test "$changed" = "$expected"

          git push origin HEAD:agent/m8-amendment-clean
