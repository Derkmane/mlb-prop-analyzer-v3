name: M11 HHR Step 3 evidence preflight

on:
  push:
    branches:
      - agent/m11-step3-hhr-box-score-verification
    paths:
      - .github/workflows/m11-step3-hhr-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify final-game pregame HHR source lineage
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const sha=(s)=>crypto.createHash('sha256').update(s).digest('hex');
          const design=JSON.parse(fs.readFileSync('fixtures/sanitized/m11/hhr/respecified-v2/balldontlie-hhr-design-matrix-v2.json','utf8'));
          const fitGameIds=new Set(design.rows.map((r)=>r.gameId));
          const targetIds=[5059497,5059498];
          if(targetIds.some((id)=>fitGameIds.has(id))) throw new Error('Final Step 3 cohort overlaps fit.');
          const bdlKey=process.env.BALLDONTLIE_API_KEY?.trim();
          const oddsKey=process.env.THE_ODDS_API_KEY?.trim();
          if(!bdlKey||!oddsKey) throw new Error('Provider secret missing.');
          const fetchJson=async(url,options={})=>{const response=await fetch(url,options);const text=await response.text();if(!response.ok)throw new Error(`${url} HTTP ${response.status}: ${text.slice(0,500)}`);return{value:JSON.parse(text),sha256:sha(text)};};
          async function bdl(endpoint){const url=new URL(`https://api.balldontlie.io/mlb/v1/${endpoint}`);for(const id of targetIds)url.searchParams.append('game_ids[]',String(id));url.searchParams.set('per_page','100');return fetchJson(url,{headers:{Authorization:bdlKey}});}
          const gamesSnap=await bdl('games');
          const lineupSnap=await bdl('lineups');
          const statsSnap=await bdl('stats');
          const games=gamesSnap.value.data??[];
          const lineups=lineupSnap.value.data??[];
          const stats=statsSnap.value.data??[];
          console.log('FINAL GAMES:',JSON.stringify(games.map((g)=>({id:g.id,date:g.date,status:g.status,home:g.home_team?.display_name,away:g.away_team?.display_name,venue:g.venue}))));
          console.log('LINEUP ROWS:',lineups.length);
          console.log('PROBABLE PITCHER ROWS:',JSON.stringify(lineups.filter((r)=>r.is_probable_pitcher===true).map((r)=>({gameId:r.game_id,playerId:r.player?.id,name:r.player?.full_name,teamId:r.team?.id,batsThrows:r.player?.bats_throws,battingOrder:r.batting_order}))));
          console.log('STARTING LINEUP COUNTS:',JSON.stringify(Object.fromEntries(targetIds.map((id)=>[id,lineups.filter((r)=>r.game_id===id&&Number.isInteger(r.batting_order)&&r.batting_order>=1&&r.batting_order<=9).length]))));
          console.log('STATS STARTERS:',JSON.stringify(stats.filter((r)=>r.games_started===1).map((r)=>({gameId:r.game_id,playerId:r.player?.id,name:r.player?.full_name,teamId:r.team?.id,batsThrows:r.player?.bats_throws,gamesStarted:r.games_started}))));
          const reports=[];
          for(const game of games){
            const home=game.home_team?.display_name??game.home_team_name;
            const away=game.away_team?.display_name??game.away_team_name;
            const snapshotTime=new Date(Date.parse(game.date)-60*60*1000).toISOString().replace(/\.\d{3}Z$/u,'Z');
            const eventsUrl=new URL('https://api.the-odds-api.com/v4/historical/sports/baseball_mlb/events');
            eventsUrl.searchParams.set('apiKey',oddsKey);eventsUrl.searchParams.set('date',snapshotTime);eventsUrl.searchParams.set('dateFormat','iso');
            const eventsSnap=await fetchJson(eventsUrl);const events=eventsSnap.value.data??eventsSnap.value;
            const matches=events.filter((e)=>e.home_team===home&&e.away_team===away&&Math.abs(Date.parse(e.commence_time)-Date.parse(game.date))<=6*60*60*1000);
            const item={gameId:game.id,snapshotTime,eventMatches:matches.length,eventsSha256:eventsSnap.sha256};
            if(matches.length===1){
              const event=matches[0];const url=new URL(`https://api.the-odds-api.com/v4/historical/sports/baseball_mlb/events/${event.id}/odds`);
              url.searchParams.set('apiKey',oddsKey);url.searchParams.set('date',snapshotTime);url.searchParams.set('bookmakers','underdog');url.searchParams.set('regions','us_dfs');url.searchParams.set('markets','batter_hits_runs_rbis,batter_hits_runs_rbis_alternate');url.searchParams.set('dateFormat','iso');url.searchParams.set('oddsFormat','american');url.searchParams.set('includeMultipliers','true');url.searchParams.set('includeSids','true');
              const snap=await fetchJson(url);const payload=snap.value.data??snap.value;const book=payload.bookmakers?.find((b)=>b.key==='underdog');
              item.eventId=event.id;item.commenceTime=event.commence_time;item.oddsSha256=snap.sha256;item.markets=(book?.markets??[]).map((m)=>({key:m.key,outcomes:m.outcomes?.length??0,firstOutcome:m.outcomes?.[0]??null}));
            }
            reports.push(item);
          }
          console.log('HISTORICAL FINAL-GAME HHR BOARDS:',JSON.stringify(reports));
          if(reports.flatMap((r)=>r.markets??[]).reduce((s,m)=>s+m.outcomes,0)===0) throw new Error('Final games have no historical pregame HHR board.');
          console.log('FINAL-GAME SOURCE PREFLIGHT: PASS');
          NODE
