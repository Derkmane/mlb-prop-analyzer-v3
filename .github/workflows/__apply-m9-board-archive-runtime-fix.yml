name: apply-m9-board-archive-runtime-fix

on:
  push:
    branches:
      - agent/m9-board-archiving
    paths:
      - scripts/__apply-m9-board-archive-runtime-fix.mjs
      - .github/workflows/__apply-m9-board-archive-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m9-board-archiving
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded correction
        run: node scripts/__apply-m9-board-archive-runtime-fix.mjs
      - name: Remove temporary transport files
        run: rm scripts/__apply-m9-board-archive-runtime-fix.mjs .github/workflows/__apply-m9-board-archive-runtime-fix.yml
      - name: Commit corrected runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/archive-m9-batter-hits-board.mjs package.json scripts/__apply-m9-board-archive-runtime-fix.mjs .github/workflows/__apply-m9-board-archive-runtime-fix.yml
          git commit -m "Harden M9 archive provider retry path"
          git push origin HEAD:agent/m9-board-archiving
