name: M11 step 2 provider-window correction

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Move July 20 into warm-up
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/capture-m11-hhr-respecified-evidence.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "  '2026-07-13','2026-07-14','2026-07-15','2026-07-16','2026-07-17','2026-07-18','2026-07-19',",
              "  '2026-07-13','2026-07-14','2026-07-15','2026-07-16','2026-07-17','2026-07-18','2026-07-19','2026-07-20',",
            ],
            [
              "  '2026-07-20','2026-07-21','2026-07-22','2026-07-23','2026-07-24','2026-07-25',",
              "  '2026-07-21','2026-07-22','2026-07-23','2026-07-24','2026-07-25',",
            ],
          ];
          for (const [before, after] of replacements) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`Expected one exact replacement; found ${count}.`);
            text = text.replace(before, after);
          }
          fs.writeFileSync(path, text);
          NODE
          node --check scripts/capture-m11-hhr-respecified-evidence.mjs
      - name: Remove temporary correction workflow
        run: rm .github/workflows/m11-step2-provider-window-correction.yml
      - name: Commit provider-window correction
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align HHR fit with historical provider window"
          git push origin HEAD:agent/m11-step2-hhr-respecification
