name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: |
          set +e
          npm install --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always > npm-install.log 2>&1
          status=$?
          tail -n 80 npm-install.log
          exit "$status"
      - name: Typecheck
        run: npm run typecheck
      - name: Check architecture
        run: npm run architecture
      - name: Build
        run: npm run build
      - name: Test selected-side domain
        run: npm run test:selected-side
      - name: Test protective architecture rejection
        run: npm run test:architecture-protective
      - name: Run complete test suite
        run: node --test "dist/test/**/*.test.js"
