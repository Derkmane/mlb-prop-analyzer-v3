name: M9 prospective board archive

on:
  workflow_dispatch:
    inputs:
      phase2_enrichment:
        description: Enable display-only Phase 2 enrichment for this run
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
  schedule:
    # Every 30 minutes. The controller performs one schedule read and captures
    # only when an uncovered game is 40-110 minutes from first pitch, with an
    # under-40-minute recovery band. A single missed scheduled run therefore
    # leaves another normal-band look before recovery is needed.
    - cron: '0,30 * * * *'
  push:
    branches:
      - main
    paths:
      - artifacts/user-projected-lineups/*.json

permissions:
  contents: write

concurrency:
  group: m9-prospective-board-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Capture prospective Batter Hits and HHR boards
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      M8_CAPTURE_START_DATE: '2026-07-08'
      M8_SHARD_OUTPUT_DIR: artifacts/m8-current-season-pa/shards-2026
      M8_CURRENT_SEASON_SHARD_ROOT: artifacts/m8-current-season-pa/shards-2026
      M10_ARCHIVE_ROOT: artifacts/board-archives/batter-hits
      M10_HHR_ARCHIVE_ROOT: artifacts/board-archives/batter-hhr
      M9_CAPTURE_CONTROLLER_PLAN: artifacts/workflow-logs/m9-capture-controller-plan.json
      M9_HITS_REPLAY_RECEIPT: artifacts/workflow-logs/m9-board-replay-hits.json
      M9_HHR_REPLAY_RECEIPT: artifacts/workflow-logs/m9-board-replay-hhr.json
      M9_CAPTURE_ALL_PREGAME: ${{ github.event_name == 'push' && '1' || '0' }}
      PHASE2_ENRICHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.phase2_enrichment || 'on' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore immutable Batter Hits archive ledger
        id: restore-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m9-board-archive-ledger-

      - name: Restore immutable HHR archive ledger
        id: restore-hhr-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-

      - name: Plan capture and take first board snapshot
        id: capture-plan
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/m9-capture-controller.mjs plan 2>&1 | tee artifacts/workflow-logs/m9-capture-controller.log

      - name: Install dependencies
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        run: npm install --ignore-scripts

      - name: Build project
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        run: npm run build

      - name: Restore verified current-season shards
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        id: restore-shards
        uses: actions/cache/restore@v4
        with:
          path: artifacts/m8-current-season-pa/shards-2026
          key: m8-current-season-shards-2026-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m8-current-season-shards-2026-

      - name: Snapshot immutable archive ledgers
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        run: |
          mkdir -p artifacts/workflow-logs
          node -e 'const fs=require("node:fs"),path=require("node:path");for(const [key,root] of [["hits","artifacts/board-archives/batter-hits"],["hhr","artifacts/board-archives/batter-hhr"]]){const dir=path.join(root,"captures");const names=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];fs.writeFileSync(`artifacts/workflow-logs/${key}-captures-before.json`,`${JSON.stringify(names)}\n`);}'

      - name: Set history end date
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        run: |
          node -e "const d=new Date();d.setUTCDate(d.getUTCDate()-1);process.stdout.write('M8_CAPTURE_END_DATE='+d.toISOString().slice(0,10)+'\n')" >> "$GITHUB_ENV"

      - name: Capture or resume verified historical shards
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        run: node scripts/capture-m8-current-season-pa-shards.mjs

      - name: Run immutable M9 Batter Hits board archiver
        id: capture-hits
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        env:
          M9_BOARD_SNAPSHOT_MANIFEST: ${{ steps.capture-plan.outputs.snapshot_manifest }}
          M9_BOARD_SNAPSHOT_CONSUMER: hits
          M9_BOARD_REPLAY_RECEIPT: ${{ env.M9_HITS_REPLAY_RECEIPT }}
          M9_BOARD_SNAPSHOT_CAPTURED_AT: ${{ steps.capture-plan.outputs.snapshot_completed_at }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node --import ./scripts/m9-board-snapshot-preload.mjs scripts/archive-m9-batter-hits-board.mjs 2>&1 | tee artifacts/workflow-logs/m9-board-archive.log

      - name: Identify new immutable Batter Hits capture
        id: identify-hits-capture
        if: always() && steps.capture-hits.outcome == 'success'
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path");const dir="artifacts/board-archives/batter-hits/captures";const before=new Set(JSON.parse(fs.readFileSync("artifacts/workflow-logs/hits-captures-before.json","utf8")));const after=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];const added=after.filter((name)=>!before.has(name));if(added.length!==1)throw new Error(`Expected exactly one new immutable Batter Hits capture after successful archiver; found ${added.length}.`);fs.appendFileSync(process.env.GITHUB_OUTPUT,`path=${path.join(dir,added[0])}\n`);console.log(`NEW BATTER HITS CAPTURE\t${path.join(dir,added[0])}`);'

      - name: Run immutable HHR evidence archiver from the same prospective slate
        id: capture-hhr
        if: steps.capture-hits.outcome == 'success' && steps.identify-hits-capture.outcome == 'success'
        env:
          M9_BOARD_SNAPSHOT_MANIFEST: ${{ steps.capture-plan.outputs.snapshot_manifest }}
          M9_BOARD_SNAPSHOT_CONSUMER: hhr
          M9_BOARD_REPLAY_RECEIPT: ${{ env.M9_HHR_REPLAY_RECEIPT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node --import ./scripts/m9-board-snapshot-preload.mjs scripts/archive-m10-batter-hhr-board.mjs 2>&1 | tee artifacts/workflow-logs/m10-hhr-board-archive.log

      - name: Identify new immutable HHR capture
        id: identify-hhr-capture
        if: always() && steps.capture-hhr.outcome == 'success'
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path");const dir="artifacts/board-archives/batter-hhr/captures";const before=new Set(JSON.parse(fs.readFileSync("artifacts/workflow-logs/hhr-captures-before.json","utf8")));const after=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];const added=after.filter((name)=>!before.has(name));if(added.length!==1)throw new Error(`Expected exactly one new immutable HHR capture after successful archiver; found ${added.length}.`);fs.appendFileSync(process.env.GITHUB_OUTPUT,`path=${path.join(dir,added[0])}\n`);console.log(`NEW HHR CAPTURE\t${path.join(dir,added[0])}`);'

      - name: Build immutable trimmed display archives
        id: build-display-archives
        if: always() && steps.identify-hits-capture.outcome == 'success' && steps.identify-hhr-capture.outcome == 'success'
        env:
          HITS_CAPTURE_PATH: ${{ steps.identify-hits-capture.outputs.path }}
          HHR_CAPTURE_PATH: ${{ steps.identify-hhr-capture.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${HITS_CAPTURE_PATH}" ] || [ -z "${HHR_CAPTURE_PATH}" ]; then
            echo "Both full capture paths are required to build the display archives."
            exit 1
          fi
          HITS_CAPTURE_NAME="${HITS_CAPTURE_PATH##*/}"
          HHR_CAPTURE_NAME="${HHR_CAPTURE_PATH##*/}"
          HITS_DISPLAY_PATH="artifacts/display-archives/batter-hits/captures/${HITS_CAPTURE_NAME}"
          HHR_DISPLAY_PATH="artifacts/display-archives/batter-hhr/captures/${HHR_CAPTURE_NAME}"
          node scripts/build-phase1-display-archive.mjs batter-hits "${HITS_CAPTURE_PATH}" "${HITS_DISPLAY_PATH}"
          node scripts/build-phase1-display-archive.mjs batter-hhr "${HHR_CAPTURE_PATH}" "${HHR_DISPLAY_PATH}"
          printf 'hits_path=%s\n' "${HITS_DISPLAY_PATH}" >> "$GITHUB_OUTPUT"
          printf 'hhr_path=%s\n' "${HHR_DISPLAY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload full archives and diagnostics before repository persistence
        id: upload-full-archives
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m9-board-archive-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifacts/board-archives/batter-hits/**
            artifacts/board-archives/batter-hhr/**
            artifacts/workflow-logs/**

      - name: Persist trimmed display archives to repository
        id: persist-display-archives
        if: always() && steps.build-display-archives.outcome == 'success' && (steps.upload-full-archives.outcome == 'success' || steps.upload-full-archives.outcome == 'failure')
        env:
          HITS_DISPLAY_PATH: ${{ steps.build-display-archives.outputs.hits_path }}
          HHR_DISPLAY_PATH: ${{ steps.build-display-archives.outputs.hhr_path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Display archive persistence requires a branch ref; got ${GITHUB_REF_TYPE}."
            exit 1
          fi
          if [ -z "${HITS_DISPLAY_PATH}" ] || [ -z "${HHR_DISPLAY_PATH}" ]; then
            echo "Both trimmed display archives are required for one durable commit."
            exit 1
          fi
          git add -f -- "${HITS_DISPLAY_PATH}" "${HHR_DISPLAY_PATH}"
          if git diff --cached --quiet; then
            echo "No trimmed display archives were staged."
            exit 1
          fi
          node -e 'const cp=require("node:child_process");const staged=cp.execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split(/\r?\n/u).filter(Boolean);const allowed=/^artifacts\/display-archives\/(batter-hits|batter-hhr)\/captures\/\d{8}T\d{9}Z--[a-f0-9]{64}\.json$/u;const invalid=staged.filter((value)=>!allowed.test(value));if(invalid.length>0)throw new Error(`Refusing to persist non-display paths: ${invalid.join(", ")}`);const markets=new Set(staged.map((value)=>allowed.exec(value)?.[1]).filter(Boolean));if(staged.length!==2||markets.size!==2)throw new Error(`Expected exactly two trimmed display archives, one per market; staged ${staged.length}.`);console.log(`STAGED TRIMMED DISPLAY ARCHIVES\t${staged.length}`);'
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: persist trimmed display archives [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify capture prerequisites before coverage
        id: verify-precoverage
        if: steps.capture-plan.outputs.decision == 'CAPTURE'
        env:
          HITS_CAPTURE_OUTCOME: ${{ steps.capture-hits.outcome }}
          HITS_IDENTIFY_OUTCOME: ${{ steps.identify-hits-capture.outcome }}
          HHR_CAPTURE_OUTCOME: ${{ steps.capture-hhr.outcome }}
          HHR_IDENTIFY_OUTCOME: ${{ steps.identify-hhr-capture.outcome }}
          DISPLAY_OUTCOME: ${{ steps.build-display-archives.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist-display-archives.outcome }}
        run: |
          set -euo pipefail
          for pair in \
            "Batter Hits archive capture:${HITS_CAPTURE_OUTCOME}" \
            "Batter Hits capture identification:${HITS_IDENTIFY_OUTCOME}" \
            "HHR archive capture:${HHR_CAPTURE_OUTCOME}" \
            "HHR capture identification:${HHR_IDENTIFY_OUTCOME}" \
            "Trimmed display archive build:${DISPLAY_OUTCOME}" \
            "Durable display persistence:${PERSIST_OUTCOME}"; do
            label="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "${label} outcome: ${outcome}; coverage will not be finalized."
              exit 1
            fi
          done
          echo "All capture prerequisites succeeded; coverage may be finalized."

      - name: Finalize game coverage
        id: finalize-coverage
        if: steps.capture-plan.outputs.decision == 'CAPTURE' && steps.verify-precoverage.outcome == 'success'
        run: node scripts/m9-capture-controller.mjs finalize

      - name: Save verified current-season shards
        if: always() && steps.capture-plan.outputs.decision == 'CAPTURE'
        uses: actions/cache/save@v4
        with:
          path: artifacts/m8-current-season-pa/shards-2026
          key: m8-current-season-shards-2026-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable HHR archive ledger
        id: save-hhr-board-archives
        if: steps.capture-plan.outputs.decision == 'NOOP' || steps.finalize-coverage.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable Batter Hits archive ledger
        id: save-hits-board-archives
        if: steps.capture-plan.outputs.decision == 'NOOP' || (steps.finalize-coverage.outcome == 'success' && steps.save-hhr-board-archives.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify archive run status
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.capture-plan.outcome }}
          PLAN_DECISION: ${{ steps.capture-plan.outputs.decision }}
          HITS_CAPTURE_OUTCOME: ${{ steps.capture-hits.outcome }}
          HITS_IDENTIFY_OUTCOME: ${{ steps.identify-hits-capture.outcome }}
          HHR_CAPTURE_OUTCOME: ${{ steps.capture-hhr.outcome }}
          HHR_IDENTIFY_OUTCOME: ${{ steps.identify-hhr-capture.outcome }}
          COVERAGE_OUTCOME: ${{ steps.finalize-coverage.outcome }}
          PRECOVERAGE_OUTCOME: ${{ steps.verify-precoverage.outcome }}
          HHR_LEDGER_OUTCOME: ${{ steps.save-hhr-board-archives.outcome }}
          HITS_LEDGER_OUTCOME: ${{ steps.save-hits-board-archives.outcome }}
          DISPLAY_OUTCOME: ${{ steps.build-display-archives.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist-display-archives.outcome }}
        run: |
          set -euo pipefail
          if [ "${PLAN_OUTCOME}" != "success" ]; then
            echo "Capture controller outcome: ${PLAN_OUTCOME}"
            exit 1
          fi
          if [ "${PLAN_DECISION}" = "NOOP" ]; then
            echo "Capture controller returned NOOP; no uncovered game is currently in the capture window."
            exit 0
          fi
          if [ "${PLAN_DECISION}" != "CAPTURE" ]; then
            echo "Unexpected capture controller decision: ${PLAN_DECISION}"
            exit 1
          fi
          for pair in \
            "Batter Hits archive capture:${HITS_CAPTURE_OUTCOME}" \
            "Batter Hits capture identification:${HITS_IDENTIFY_OUTCOME}" \
            "HHR archive capture:${HHR_CAPTURE_OUTCOME}" \
            "HHR capture identification:${HHR_IDENTIFY_OUTCOME}" \
            "Pre-coverage verification:${PRECOVERAGE_OUTCOME}" \
            "Coverage finalization:${COVERAGE_OUTCOME}" \
            "HHR ledger durability:${HHR_LEDGER_OUTCOME}" \
            "Batter Hits ledger durability:${HITS_LEDGER_OUTCOME}" \
            "Trimmed display archive build:${DISPLAY_OUTCOME}" \
            "Durable display persistence:${PERSIST_OUTCOME}"; do
            label="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "${label} outcome: ${outcome}"
              exit 1
            fi
          done
          echo "CAPTURE completed: both archivers consumed the first snapshot, coverage finalized, and display archives persisted."
