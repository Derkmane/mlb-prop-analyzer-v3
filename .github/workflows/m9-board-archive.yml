name: M9 prospective board archive

on:
  workflow_dispatch:
  schedule:
    # 21:15 UTC is 4:15 PM Central during the MLB regular season. With the
    # warm daily shard cache, the board snapshot should land roughly 60-80
    # minutes before the common 5:35-6:10 PM Central evening starts, after
    # substantially more official lineups are available but before first pitch.
    # The existing strict pregame gate still excludes any earlier-starting game.
    - cron: '15 21 * * *'
  push:
    branches:
      - agent/m9-board-archiving
    paths:
      - .github/workflows/m9-board-archive.yml

permissions:
  contents: write

concurrency:
  group: m9-prospective-board-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Capture prospective Batter Hits and HHR boards
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      M8_CAPTURE_START_DATE: '2026-07-08'
      M8_SHARD_OUTPUT_DIR: artifacts/m8-current-season-pa/shards-2026
      M8_CURRENT_SEASON_SHARD_ROOT: artifacts/m8-current-season-pa/shards-2026
      M10_ARCHIVE_ROOT: artifacts/board-archives/batter-hits
      M10_HHR_ARCHIVE_ROOT: artifacts/board-archives/batter-hhr

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Restore verified current-season shards
        id: restore-shards
        uses: actions/cache/restore@v4
        with:
          path: artifacts/m8-current-season-pa/shards-2026
          key: m8-current-season-shards-2026-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m8-current-season-shards-2026-

      - name: Restore immutable Batter Hits archive ledger
        id: restore-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m9-board-archive-ledger-

      - name: Restore immutable HHR archive ledger
        id: restore-hhr-board-archives
        uses: actions/cache/restore@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            m10-hhr-board-archive-ledger-

      - name: Snapshot immutable archive ledgers
        run: |
          mkdir -p artifacts/workflow-logs
          node -e 'const fs=require("node:fs"),path=require("node:path");for(const [key,root] of [["hits","artifacts/board-archives/batter-hits"],["hhr","artifacts/board-archives/batter-hhr"]]){const dir=path.join(root,"captures");const names=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];fs.writeFileSync(`artifacts/workflow-logs/${key}-captures-before.json`,`${JSON.stringify(names)}\n`);}'

      - name: Set history end date
        run: |
          node -e "const d=new Date();d.setUTCDate(d.getUTCDate()-1);process.stdout.write('M8_CAPTURE_END_DATE='+d.toISOString().slice(0,10)+'\n')" >> "$GITHUB_ENV"

      - name: Capture or resume verified historical shards
        run: node scripts/capture-m8-current-season-pa-shards.mjs

      - name: Run immutable M9 Batter Hits board archiver
        id: capture-hits
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node scripts/archive-m9-batter-hits-board.mjs 2>&1 | tee artifacts/workflow-logs/m9-board-archive.log

      - name: Identify new immutable Batter Hits capture
        id: identify-hits-capture
        if: always() && steps.capture-hits.outcome == 'success'
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path");const dir="artifacts/board-archives/batter-hits/captures";const before=new Set(JSON.parse(fs.readFileSync("artifacts/workflow-logs/hits-captures-before.json","utf8")));const after=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];const added=after.filter((name)=>!before.has(name));if(added.length!==1)throw new Error(`Expected exactly one new immutable Batter Hits capture after successful archiver; found ${added.length}.`);fs.appendFileSync(process.env.GITHUB_OUTPUT,`path=${path.join(dir,added[0])}\n`);console.log(`NEW BATTER HITS CAPTURE\t${path.join(dir,added[0])}`);'

      - name: Run immutable HHR evidence archiver from the same prospective slate
        id: capture-hhr
        if: steps.capture-hits.outcome == 'success' && steps.identify-hits-capture.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/workflow-logs
          node --import ./scripts/m10-hhr-raw-board-preload.mjs scripts/archive-m10-batter-hhr-board.mjs 2>&1 | tee artifacts/workflow-logs/m10-hhr-board-archive.log

      - name: Identify new immutable HHR capture
        id: identify-hhr-capture
        if: always() && steps.capture-hhr.outcome == 'success'
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path");const dir="artifacts/board-archives/batter-hhr/captures";const before=new Set(JSON.parse(fs.readFileSync("artifacts/workflow-logs/hhr-captures-before.json","utf8")));const after=fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).filter((entry)=>entry.isFile()&&entry.name.endsWith(".json")).map((entry)=>entry.name).sort():[];const added=after.filter((name)=>!before.has(name));if(added.length!==1)throw new Error(`Expected exactly one new immutable HHR capture after successful archiver; found ${added.length}.`);fs.appendFileSync(process.env.GITHUB_OUTPUT,`path=${path.join(dir,added[0])}\n`);console.log(`NEW HHR CAPTURE\t${path.join(dir,added[0])}`);'

      - name: Persist successful immutable captures to repository
        id: persist-captures
        if: always() && (steps.identify-hits-capture.outcome == 'success' || steps.identify-hhr-capture.outcome == 'success')
        env:
          HITS_CAPTURE_PATH: ${{ steps.identify-hits-capture.outputs.path }}
          HHR_CAPTURE_PATH: ${{ steps.identify-hhr-capture.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Archive persistence requires a branch ref; got ${GITHUB_REF_TYPE}."
            exit 1
          fi
          if [ -n "${HITS_CAPTURE_PATH}" ]; then
            git add -f -- "${HITS_CAPTURE_PATH}"
          fi
          if [ -n "${HHR_CAPTURE_PATH}" ]; then
            git add -f -- "${HHR_CAPTURE_PATH}"
          fi
          if git diff --cached --quiet; then
            echo "No successful immutable capture was staged."
            exit 1
          fi
          node -e 'const cp=require("node:child_process");const staged=cp.execFileSync("git",["diff","--cached","--name-only"],{encoding:"utf8"}).trim().split(/\r?\n/u).filter(Boolean);const allowed=/^artifacts\/board-archives\/(?:batter-hits|batter-hhr)\/captures\/[^/]+\.json$/u;const invalid=staged.filter((value)=>!allowed.test(value));if(invalid.length>0)throw new Error(`Refusing to persist non-capture paths: ${invalid.join(", ")}`);console.log(`STAGED IMMUTABLE CAPTURES\t${staged.length}`);'
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: persist prospective board archives [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save verified current-season shards
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/m8-current-season-pa/shards-2026
          key: m8-current-season-shards-2026-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable Batter Hits archive ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hits
          key: m9-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save immutable HHR archive ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/board-archives/batter-hhr
          key: m10-hhr-board-archive-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload archive and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-board-archive-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifacts/board-archives/batter-hits/**
            artifacts/board-archives/batter-hhr/**
            artifacts/workflow-logs/**

      - name: Verify archive run status
        if: always()
        env:
          HITS_CAPTURE_OUTCOME: ${{ steps.capture-hits.outcome }}
          HITS_IDENTIFY_OUTCOME: ${{ steps.identify-hits-capture.outcome }}
          HHR_CAPTURE_OUTCOME: ${{ steps.capture-hhr.outcome }}
          HHR_IDENTIFY_OUTCOME: ${{ steps.identify-hhr-capture.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist-captures.outcome }}
        run: |
          set -euo pipefail
          if [ "${HITS_CAPTURE_OUTCOME}" != "success" ]; then
            echo "Batter Hits archive capture outcome: ${HITS_CAPTURE_OUTCOME}"
            exit 1
          fi
          if [ "${HITS_IDENTIFY_OUTCOME}" != "success" ]; then
            echo "Batter Hits immutable capture identification outcome: ${HITS_IDENTIFY_OUTCOME}"
            exit 1
          fi
          if [ "${HHR_CAPTURE_OUTCOME}" != "success" ]; then
            echo "HHR archive capture outcome: ${HHR_CAPTURE_OUTCOME}"
            exit 1
          fi
          if [ "${HHR_IDENTIFY_OUTCOME}" != "success" ]; then
            echo "HHR immutable capture identification outcome: ${HHR_IDENTIFY_OUTCOME}"
            exit 1
          fi
          if [ "${PERSIST_OUTCOME}" != "success" ]; then
            echo "Durable archive persistence outcome: ${PERSIST_OUTCOME}"
            exit 1
          fi
          echo "Both immutable board captures were durably persisted."
