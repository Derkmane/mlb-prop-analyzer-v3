name: Step D exact Hits patch bootstrap

on:
  push:
    branches:
      - codex/workstream1-step-d-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and apply exact approved Hits replay patch
        env:
          EXPECTED_ORIGINAL_BLOB: bfdd758b17ef0dcade4cc84f31af5d8664e40c39
          OLD_ONE: ICBjb25zdCBzbmFwc2hvdENhcHR1cmVkQXQgPSBjYXB0dXJlZEF0ID8/IG5ldyBEYXRlKCkudG9JU09TdHJpbmcoKTsKICBjb25zdCByZXNwb25zZSA9IGF3YWl0IGZldGNoKHVybCwgeyBoZWFkZXJzLCBzaWduYWwgfSk7
          NEW_ONE: 
          OLD_TWO: ICBjb25zdCBjYXB0dXJlZEF0ID0gbm93LnRvSVNPU3RyaW5nKCk7CiAgY29uc3QgY2FwdHVyZURhdGVVdGMgPSBjYXB0dXJlZEF0LnNsaWNlKDAsIDEwKTs=
          NEW_TWO: 
        run: |
          set -euo pipefail
          FILE=scripts/archive-m9-batter-hits-board.mjs
          BEFORE="$(git hash-object "$FILE")"
          echo "BEFORE_BLOB=$BEFORE"
          if [ "$BEFORE" != "$EXPECTED_ORIGINAL_BLOB" ]; then
            grep -F "x-m9-board-snapshot-captured-at" "$FILE" >/dev/null
            grep -F "M9_BOARD_SNAPSHOT_CAPTURED_AT" "$FILE" >/dev/null
            echo "PATCH_COMMIT=$(git rev-parse HEAD)"
            echo "PATCHED_BLOB=$(git rev-parse HEAD:$FILE)"
            git push origin --delete "$GITHUB_REF_NAME"
            exit 0
          fi
          node -e 'const fs=require("node:fs"),p=process.argv[1],a=Buffer.from(process.env.OLD_ONE,"base64").toString(),b=Buffer.from(process.env.NEW_ONE,"base64").toString(),c=Buffer.from(process.env.OLD_TWO,"base64").toString(),d=Buffer.from(process.env.NEW_TWO,"base64").toString();let s=fs.readFileSync(p,"utf8");for(const [oldText,newText,label] of [[a,b,"ONE"],[c,d,"TWO"]]){const first=s.indexOf(oldText);if(first<0||s.indexOf(oldText,first+1)>=0)throw new Error(`Expected exactly one ${label} replacement target.`);s=s.replace(oldText,newText)}fs.writeFileSync(p,s)' "$FILE"
          node --check "$FILE"
          git diff --check -- "$FILE"
          git diff -- "$FILE"
          git add -- "$FILE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix: preserve first-snapshot capture time in Hits archive"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          echo "PATCHED_BLOB=$(git rev-parse HEAD:$FILE)"
          git push origin "HEAD:$GITHUB_REF_NAME"
