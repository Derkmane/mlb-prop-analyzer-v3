name: M11 step 2 respecification executor

on:
  push:
    branches:
      - agent/m11-step2-hhr-respecification

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Register respecified scripts in verification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            'node --check scripts/capture-m11-hhr-respecified-evidence.mjs',
            'node --check scripts/fit-m11-batter-hhr-respecified.mjs',
          ];
          for (const addition of additions) {
            if (!pkg.scripts['check:scripts'].includes(addition)) {
              pkg.scripts['check:scripts'] += ` && ${addition}`;
            }
          }
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Capture complete seven-input design matrix
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: node scripts/capture-m11-hhr-respecified-evidence.mjs 2>&1 | tee /tmp/m11-step2-capture.log
      - name: Fit once, retain evidence, and enforce gates A-C
        run: |
          set +e
          node scripts/fit-m11-batter-hhr-respecified.mjs 2>&1 | tee /tmp/m11-step2-fit.log
          fit_status=${PIPESTATUS[0]}
          set -e
          if [ "$fit_status" -ne 0 ]; then
            rm -f .github/workflows/m11-step2-respec-executor.yml .github/workflows/m11-step2-respec-preflight.yml
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "Retain failed HHR respecification diagnostics"
            git push origin HEAD:agent/m11-step2-hhr-respecification
            exit "$fit_status"
          fi
      - name: Build and run focused HHR and Batter Hits identity gates
        run: |
          npm run build
          node --test dist/test/m11-batter-hhr-direct-composite.test.js test/m11-batter-hits-byte-identity.test.mjs
      - name: Run complete verification
        run: npm run verify 2>&1 | tee /tmp/m11-step2-verify.log
      - name: Remove temporary execution workflows
        run: rm -f .github/workflows/m11-step2-respec-executor.yml .github/workflows/m11-step2-respec-preflight.yml
      - name: Commit accepted fit and retained diagnostics
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Respecify HHR direct composite fit"
          git push origin HEAD:agent/m11-step2-hhr-respecification
