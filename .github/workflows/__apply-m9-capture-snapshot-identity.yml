name: apply-m9-capture-snapshot-identity

on:
  push:
    branches:
      - agent/m9-board-archiving
    paths:
      - scripts/__apply-m9-capture-snapshot-identity.mjs
      - scripts/__fix-m9-capture-patch-parser.mjs
      - .github/workflows/__apply-m9-capture-snapshot-identity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m9-board-archiving
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct temporary patch parser
        run: node scripts/__fix-m9-capture-patch-parser.mjs
      - name: Apply guarded capture-snapshot correction
        run: node scripts/__apply-m9-capture-snapshot-identity.mjs
      - name: Remove temporary correction files
        run: |
          rm scripts/__fix-m9-capture-patch-parser.mjs
          rm scripts/__apply-m9-capture-snapshot-identity.mjs
          rm .github/workflows/__apply-m9-capture-snapshot-identity.yml
      - name: Commit and push scoped correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/archive-m9-batter-hits-board.mjs scripts/m9-board-archive-utils.mjs scripts/m9-board-archive-funnel-utils.mjs test/m9-board-archive.test.mjs test/m9-board-archive-funnel.test.mjs test/m9-board-archive-live-boundary.test.mjs scripts/__fix-m9-capture-patch-parser.mjs scripts/__apply-m9-capture-snapshot-identity.mjs .github/workflows/__apply-m9-capture-snapshot-identity.yml
          git commit -m "Replace daily archives with capture snapshots"
          git push origin HEAD:agent/m9-board-archiving
