name: Projected lineup Step A verify

on:
  push:
    branches:
      - agent/projected-lineup-path

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run npm verify
        run: npm run verify
