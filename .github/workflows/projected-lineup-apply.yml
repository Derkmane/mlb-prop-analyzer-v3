name: Projected lineup integration apply

on:
  push:
    branches:
      - agent/projected-lineup-path
    paths:
      - scripts/apply-projected-lineup-integration.mjs
      - scripts/apply-projected-lineup-hhr.mjs
      - .github/workflows/projected-lineup-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/projected-lineup-path
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build shared resolver before script imports
        run: npm run build

      - name: Normalize and syntax-check patch generators
        run: |
          set -euo pipefail
          node scripts/normalize-projected-lineup-patch-literals.mjs
          node --check scripts/apply-projected-lineup-integration.mjs
          node --check scripts/apply-projected-lineup-hhr.mjs

      - name: Apply Hits integration
        run: node scripts/apply-projected-lineup-integration.mjs

      - name: Apply HHR integration
        run: node scripts/apply-projected-lineup-hhr.mjs

      - name: Confirm HHR team-wide hard gate is gone
        run: |
          set -euo pipefail
          if grep -n "starting-nine-incomplete" scripts/archive-m10-batter-hhr-board.mjs; then
            echo "starting-nine-incomplete hard gate remains"
            exit 1
          fi
          grep -n "preceding-slot-unresolvable" scripts/archive-m10-batter-hhr-board.mjs
          grep -n "no-slot-evidence-within-lookback" scripts/archive-m10-batter-hhr-board.mjs

      - name: Check modified scripts
        run: |
          node --check scripts/archive-m9-batter-hits-board.mjs
          node --check scripts/archive-m10-batter-hhr-board.mjs

      - name: Build modified repository
        run: npm run build

      - name: Run focused projected-lineup tests and Gate J
        run: |
          set -euo pipefail
          node --test \
            dist/test/projected-lineup-resolution.test.js \
            test/m11-projected-lineup-status-invariance.test.mjs \
            test/m9-player-identity-live-path.test.mjs \
            test/m11-batter-hits-byte-identity.test.mjs

      - name: Remove temporary patch machinery
        run: |
          git rm scripts/apply-projected-lineup-integration.mjs
          git rm scripts/apply-projected-lineup-hhr.mjs
          git rm scripts/normalize-projected-lineup-patch-literals.mjs
          git rm .github/workflows/projected-lineup-apply.yml

      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/archive-m9-batter-hits-board.mjs scripts/archive-m10-batter-hhr-board.mjs
          git diff --cached --check
          git commit -m "feat: resolve projected lineup slots for Hits and HHR"
          git push origin HEAD:agent/projected-lineup-path
