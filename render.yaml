services:
  - type: web
    name: mlb-prop-analyzer-v3
    runtime: node
    plan: free
    buildCommand: "npm install --ignore-scripts && npm run build"
    startCommand: "node dist/src/composition/hhr-display-server.js"
    healthCheckPath: /healthz
    envVars:
      - key: HHR_DISPLAY_PASSWORD
        sync: false
